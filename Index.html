function fmtTime(iso){if(!iso)return'-';const d=new Date(iso);if(isNaN(d.getTime()))return String(iso);
  const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* 1. Dual approval — ต้องครบ Procurement Mgr + BD Mgr ถึงจะเป็น Approved
   v4.1: ส่งให้ server อนุมัติแบบ atomic (action 'approve') — server อ่าน approvalRoles ล่าสุดจาก Sheet เอง
   แก้ปัญหา Procurement กับ BD กดอนุมัติจากเครื่องตัวเองใกล้ ๆ กัน แล้วการอนุมัติของอีกฝ่ายหาย */
const APPROVE_ERR_TH={NOT_IN_APPROVAL:'ใบนี้ไม่ได้อยู่ในขั้นตอนอนุมัติแล้ว (มีคนเปลี่ยนสถานะก่อนหน้า)',
  ALREADY_APPROVED:'บทบาทของคุณอนุมัติใบนี้ไปแล้ว',ROLE_CANNOT_APPROVE:'บทบาทของคุณไม่มีสิทธิ์อนุมัติ',
  NO_DETAIL:'ข้อมูลใบนี้บน Sheet ไม่สมบูรณ์ — กดซิงค์แล้วลองใหม่',ACCESS_DENIED:'ไม่มีสิทธิ์อนุมัติ'};
function approveCheck(q){
  if(!inApprovalStage(q)){toast('ใบนี้ไม่ได้อยู่ในขั้นตอนอนุมัติ (สถานะ '+(STATUS_TH[statusOf(q)]||statusOf(q))+')','bad');return false}
  const role=CURRENT.role;
  if(REQUIRED_APPROVAL_ROLES.indexOf(role)<0&&APPROVAL_OVERRIDE_ROLES.indexOf(role)<0){
    toast('บทบาท '+role+' ไม่มีสิทธิ์อนุมัติ (ต้องเป็น '+REQUIRED_APPROVAL_ROLES.join(' หรือ ')+')','bad');return false}
  if((q.approvalRoles||[]).indexOf(role)>=0){toast('บทบาท '+role+' อนุมัติใบนี้ไปแล้ว','bad');return false}
  return true;
}
let _approving=false;
async function approve(id){
  const q=QUOTES.find(x=>x.id===id);if(!q||_approving)return;
  if(!approveCheck(q))return;
  if(!cloudReady()){approveLocal(id);return}               // ออฟไลน์ล้วน → แบบเดิม (เข้าคิว + conflict guard)
  _approving=true;toast('กำลังบันทึกการอนุมัติ…','');
  try{
    const r=await postCloud({action:'approve',id});
    if(r.ok&&r.data){
      const d=r.data;
      const m=mergeRemoteRow({id,detail:d.detail,updatedAt:d.updatedAt,by:CURRENT.name},{force:true});
      if(!m)await refreshQuote(id,{force:true});
      LS.set('quotes',QUOTES);_flashIds[id]=Date.now();
      toast(d.complete
        ?'อนุมัติครบ 2 ฝ่ายแล้ว — '+gatekeeperName()+' จะเห็นราคาก่อนแล้วกดปล่อยให้ Sales'
        :'บันทึกการอนุมัติของ '+CURRENT.role+' แล้ว · ยังรอ: '+(d.missing||[]).join(', '),'good');
      renderNav();render();return;
    }
    if(/unknown action/i.test(r.error||'')){approveLocal(id);return}   // Code.gs รุ่นเก่า
    await refreshQuote(id);renderNav();render();
    toast((APPROVE_ERR_TH[r.error]||('อนุมัติไม่สำเร็จ: '+(r.error||'-')))+' — แสดงข้อมูลล่าสุดแล้ว','bad');
  }finally{_approving=false}
}
function approveLocal(id){
  const q=QUOTES.find(x=>x.id===id);if(!q||!approveCheck(q))return;
  const role=CURRENT.role;

  const old=q.status||QT_DEFAULT_STATUS;
  if(!Array.isArray(q.approvalRoles))q.approvalRoles=[];
  if(!Array.isArray(q.approvals))q.approvals=[];
  q.approvalRoles.push(role);
  q.approvals.push({by:CURRENT.name,role:role,act:'อนุมัติ',at:new Date().toISOString()});

  const a=approvalState(q);
  updateStatus(q,a.complete?'Approved':'Partial Approved');
  if(a.complete)q.needsApproval=false;
  q.isSynced=false;
  logAction(q.id,'Approved by '+role,null,old+' → '+q.status+(a.complete?'':' (รอ '+a.missing.join(', ')+')'));
  LS.set('quotes',QUOTES);
  toast(a.complete
    ? 'อนุมัติครบ 2 ฝ่ายแล้ว — '+gatekeeperName()+' จะเห็นราคาก่อนแล้วกดปล่อยให้ Sales'
    : 'บันทึกการอนุมัติของ '+role+' แล้ว · ยังรอ: '+a.missing.join(', '),'good');
  syncCloud(q);renderNav();render();
}

/* 2 & 3. Gatekeeper (NON) ปล่อยราคา — auto-grant ให้ Sales ต้นทางจาก header.salesUserId */
function canRelease(q){
  if(!q||q.docType==='SR'||!CURRENT)return false;
  if((q.status||QT_DEFAULT_STATUS)!=='Approved')return false;
  // ผู้ปล่อยราคา: gatekeeper หลัก / ผู้รับมอบหมายชั่วคราว / ผู้ที่ถูกทำเครื่องหมาย / ผู้จัดการ (สำรองกรณี NON ลา)
  return isReleaser(CURRENT)||perms().approve;
}
/* ผู้มีสิทธิ์ปล่อยราคา (นอกเหนือจากผู้จัดการ) — รองรับการมอบหมายเมื่อ NON ไม่อยู่ */
function isReleaser(u){
  u=u||CURRENT; if(!u)return false;
  if(u.id===gatekeeperId())return true;                                   // 1) gatekeeper หลัก
  if(SETTINGS.releaseDelegateId&&u.id===SETTINGS.releaseDelegateId)return true;  // 2) ผู้รับมอบหมายชั่วคราว
  if(u.isReleaseGatekeeper)return true;                                    // 3) ผู้ที่ถูกทำเครื่องหมายไว้
  return false;
}
function releasePrice(id){
  const q=QUOTES.find(x=>x.id===id);if(!q)return;
  if(!canRelease(q)){toast('เฉพาะ '+gatekeeperName()+' (หรือผู้จัดการ) เท่านั้นที่ปล่อยราคาได้','bad');return}
  const ownerId=q.header&&q.header.salesUserId;
  if(!ownerId){
    modal(`<div class="modal-h"><h3 style="color:var(--red)">ปล่อยราคาไม่ได้</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><p style="line-height:1.7">ใบนี้ยังไม่ได้ผูก <b>Sales เจ้าของงาน</b> ระบบจึงไม่รู้ว่าต้องปล่อยราคาให้ใคร</p>
      <p class="hint" style="margin-top:8px">ให้ผู้จัดการไปผูกเจ้าของงานที่หน้า <b>ติดตามงาน → ไม่ระบุเจ้าของ</b> ก่อน แล้วค่อยกดปล่อยราคาอีกครั้ง</p></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">เข้าใจแล้ว</button></div>`);
    return;
  }
  const owner=USERS.find(u=>u.id===ownerId);
  const ownerName=owner?owner.name:ownerId;
  const t=quoteTotals(q);
  // Error prevention: ยืนยันก่อน พร้อมระบุชื่อ Sales และมูลค่าที่กำลังจะปล่อย
  modal(`<div class="modal-h"><h3>ยืนยันการปล่อยราคา</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <p style="line-height:1.9;font-size:14px">กำลังจะปล่อยราคาใบ <b>${esc(q.docNo||q.header.ref||'')}</b><br>
      ให้กับ Sales เจ้าของงาน: <b style="color:var(--blue)">${esc(ownerName)}</b><br>
      มูลค่ารวม: <b>฿${fmt0(t.total)}</b> · %GP <b>${(t.gp||0).toFixed(1)}%</b></p>
    <div class="hint" style="margin-top:10px;line-height:1.7">เมื่อปล่อยแล้ว ${esc(ownerName)} จะเห็นราคานี้และนำไปเสนอลูกค้าได้ · สถานะจะเปลี่ยนเป็น <b>Pending</b></div>
  </div>
  <div class="modal-f"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn" style="background:var(--blue)" onclick="closeModal();doRelease('${q.id}')">🔓 ยืนยันปล่อยราคาให้ ${esc(ownerName)}</button></div>`);
}
function doRelease(id){
  const q=QUOTES.find(x=>x.id===id);if(!q)return;
  if(!canRelease(q)){toast('ไม่มีสิทธิ์ปล่อยราคา','bad');return}
  const ownerId=q.header&&q.header.salesUserId;if(!ownerId)return;
  const owner=USERS.find(u=>u.id===ownerId);
  const ownerName=owner?owner.name:ownerId;
  const before=(q.releasedTo||[]).slice();
  q.releasedTo=[...new Set([...(q.releasedTo||[]),ownerId])];   // auto-grant กลับไปที่ Sales ต้นทาง
  q.releasedAt=new Date().toISOString();
  q.releasedBy=CURRENT.id;
  q.ownerLockedAt=q.ownerLockedAt||new Date().toISOString();    // ตรึงเจ้าของงาน ณ เวลาปล่อยราคา
  updateStatus(q,'Pending');                                    // Approved → Pending
  q.isSynced=false;
  logAction(q.id,'Released price',null,'Approved → Pending · ให้สิทธิ์ '+ownerName+' โดย '+CURRENT.name+
    (before.length?(' (เดิม: '+before.map(i=>(USERS.find(u=>u.id===i)||{}).name||i).join(', ')+')'):''));
  LS.set('quotes',QUOTES);
  toast('ปล่อยราคาให้ '+ownerName+' แล้ว — สถานะเปลี่ยนเป็น Pending','good');
  syncCloud(q);renderNav();render();
}

/* ============================================================ สรุปทีมขาย (รวมของ Sales ทุกคน → ส่งผู้บริหาร)

let sumSalesFilter='all';

/* ---- Weekly follow-up Kanban: จัดใบเป็นคอลัมน์ตามสถานะ (ข้อมูลชุดเดียวกับตารางสรุป) ---- */
const KANBAN_COLS=[
  {key:'In Progress', label:'Sourcing ทำราคา',    match:q=>['Requested','In Progress'].indexOf(statusOf(q))>=0, color:'var(--orange)'},
  {key:'Submitted',   label:'รอผู้บริหารอนุมัติ',  match:q=>['Submitted','Partial Approved'].indexOf(statusOf(q))>=0, color:'var(--amber)'},
  {key:'Approved',    label:'รอปล่อยราคา',         match:q=>statusOf(q)==='Approved', color:'var(--blue)'},

function kanbanScope(){

function kanbanCard(q){

  const gpBox=(canSeeCost(CURRENT)&&appr)?(()=>{const t=quoteTotals(q);return `<div class="kc-gp ${gpClass(t.gp,q.header.groupType)}">${pp(t.gp)}<span>%GP</span></div>`})():'';

function viewKanban(){

function teamStats(){
  const rows={};
  const add=uid=>{
    if(!rows[uid])rows[uid]={id:uid,name:(USERS.find(u=>u.id===uid)||{}).name||(uid||'ไม่ระบุเจ้าของ'),
      open:0,inHand:0,value:0,needUpd:0,overdue:0,won:0,wonValue:0,lastUpd:''};
    return rows[uid];
  };
  QUOTES.filter(q=>!q.deleted).forEach(q=>{
    const r=add((q.header&&q.header.salesUserId)||'');
    const b=ballOf(q),st=statusOf(q);
    if(b.who!=='done')r.open++;
    if(b.who==='sales'){
      r.inHand++;r.value+=quoteTotals(q).total;
      if(needsSalesUpdate(q))r.needUpd++;
      if(isOverdueFollow(q))r.overdue++;
    }
    if(st==='Won'){r.won++;r.wonValue+=quoteTotals(q).total}
    const u=lastUpdate(q);
    if(u&&u.at>(r.lastUpd||''))r.lastUpd=u.at;
  });
  return Object.values(rows).sort((a,b)=>b.value-a.value);
}
function staleList(){
  return QUOTES.filter(needsSalesUpdate).sort((a,b)=>{
    const da=lastUpdate(a)?lastUpdate(a).at:'',db=lastUpdate(b)?lastUpdate(b).at:'';
    return String(da).localeCompare(String(db));
  });
}
function stageBreakdown(){
  const m={};
  QUOTES.filter(q=>!q.deleted&&ballOf(q).who==='sales').forEach(q=>{
    const u=lastUpdate(q);
    const k=(u&&u.stage)?u.stage:'ยังไม่ได้อัปเดต';
    if(!m[k])m[k]={n:0,value:0};
    m[k].n++;m[k].value+=quoteTotals(q).total;
  });
  return Object.entries(m).sort((a,b)=>b[1].value-a[1].value);
}

let _catalogAudit=null;
function auditCatalog(){
  const seen={};const dups=[];const noDesc=[];const noGroup=[];
  const all=[...CATALOG.products,...CUSTOM];
  all.forEach(p=>{
    if(!p.code)return;
    if(seen[p.code]){if(!dups.includes(p.code))dups.push(p.code);}else seen[p.code]=true;
    if(!(p.desc||'').trim())noDesc.push(p.code);
    if(!(p.group||'').trim())noGroup.push(p.code);
  });
  _catalogAudit={dups,noDesc,noGroup,ok:!dups.length&&!noDesc.length&&!noGroup.length};
  return _catalogAudit;
}

function masterMore(){mLimit+=MASTER_PAGE;const b=document.getElementById('mTbody');if(b)b.innerHTML=masterRows();}
function masterRows(){
  const full=masterList();
  const list=full.slice(0,mLimit);
  const footer=full.length>list.length
    ? `<tr style="background:var(--surface-2)"><td colspan="11" style="text-align:center;padding:12px">
        <span class="hint" style="margin-right:10px">แสดง ${list.length} จาก ${full.length} รายการ</span>
        <button class="btn tiny ghost" onclick="masterMore()">โหลดเพิ่ม ${Math.min(MASTER_PAGE,full.length-list.length)} รายการ</button></td></tr>`
    : (full.length>MASTER_PAGE?`<tr style="background:var(--surface-2)"><td colspan="11" style="text-align:center;padding:10px"><span class="hint">— แสดงครบ ${full.length} รายการ —</span></td></tr>`:'');
  const customCodes=new Set(CUSTOM.map(p=>p.code));
  return (list.map(p=>{const pr=PRICES[p.code]||{};return `<tr>
    <td class="mono" style="font-weight:600;font-size:12px">${esc(p.code)} ${customCodes.has(p.code)?'<span class="tag orange" style="font-size:9px">เพิ่มเอง</span>':''}</td>
    <td style="white-space:normal;max-width:260px;font-size:12px">${esc(p.desc)}</td>
    <td><span class="tag grey" style="font-size:10px">${esc(p.group)}</span></td>
    <td style="font-size:12px">${esc(p.uom)}</td>
    <td style="display:flex;align-items:center;gap:3px"><input class="cell-inp" style="width:82px" type="number" step="any" value="${pr.price!=null?pr.price:''}" placeholder="—" onchange="onPriceEdit('${esc(p.code)}',this.value,null)">${pr.price!=null?`<button class="x" style="width:20px;height:20px;flex-shrink:0" onclick="clearItemPrice('${esc(p.code)}')" title="ล้างราคา"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`:''}</td>
    <td><select class="cell-inp" style="width:64px;text-align:left;padding-left:5px" onchange="onPriceEdit('${esc(p.code)}',null,this.value)">
        ${['USD','CNY','THB'].map(c=>`<option ${(pr.cur||'USD')===c?'selected':''}>${c}</option>`).join('')}</select></td>
    <td><input class="cell-inp" style="width:92px" type="number" step="any" placeholder="—"
        value="${BOIS[p.code]!=null?BOIS[p.code]:(p.boiPrice!=null?p.boiPrice:'')}"
        title="ราคา BOI (ใช้อ้างอิงตอนขอสิทธิ์ BOI) — เว้นว่างเพื่อลบ"
        onchange="onBoiEdit('${esc(p.code)}',this.value,this)"></td>
    <td class="r mono" style="font-size:12px">${p.duty!=null?(p.duty*100)+'%':'—'}</td>
    <td><select class="cell-inp" style="width:108px;text-align:left;padding-left:5px;font-size:11px" onchange="setItemComGroup('${esc(p.code)}',this.value);toast('ตั้งกลุ่มคอม: '+this.value,'good')" title="กลุ่มสำหรับคำนวณคอมมิชชั่น (ใช้แทนการเดาจากหมวด)">
        ${COM_CATS.map(c=>`<option ${p.comGroup===c?'selected':''}>${c}</option>`).join('')}</select></td>
    <td style="font-size:12px">${esc(p.supplier||'—')}</td>
    <td>${customCodes.has(p.code)?`<button class="x" style="width:26px;height:26px" onclick="delProduct('${esc(p.code)}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`:''}</td></tr>`}).join('')
    ||'<tr><td colspan="11"><div class="empty" style="padding:30px">ไม่พบสินค้าในกลุ่มที่คุณมีสิทธิ์</div></td></tr>')+footer;
}
function onPriceEdit(code,price,cur){
  const cur0=(PRICES[code]||{}).cur||'USD';
  const price0=(PRICES[code]||{}).price;
  setItemPrice(code, price!=null?price:(price0!=null?price0:''), cur!=null?cur:cur0);
  const o=PRICES[code]; if(o)syncProduct(Object.assign({code,defaultPrice:o.price,defaultCur:o.cur},allProducts().find(p=>p.code===code)||{}));
  toast('บันทึกราคา '+code,'good');
}
function onBoiEdit(code,price,el){
  setItemBoiPrice(code,price===''?null:price);
  const p=allProducts().find(x=>x.code===code); if(p)syncProduct(p);   // 3.4: push to the Products tab too
  flashSaved(el);toast(price===''?('ล้างราคา BOI '+code):('บันทึก BOI '+code),'good');
}

function saveProduct(){
  const code=$('#np_code').value.trim();if(!code){toast('กรุณาใส่รหัสสินค้า','bad');return}
  if(allProducts().some(p=>p.code===code)){toast('มีรหัสนี้แล้ว','bad');return}
  const cg=$('#np_comgroup')?$('#np_comgroup').value:'';
  const p={code,desc:$('#np_desc').value.trim(),group:$('#np_group').value,comGroup:cg,uom:$('#np_uom').value.trim()||'pcs',
    warranty:$('#np_warr').value.trim(),duty:($('#np_duty').value!==''?(+$('#np_duty').value)/100:0),
    supplier:$('#np_supp').value.trim(),lead:$('#np_lead').value.trim(),sap:''};
  CUSTOM.push(p);LS.set('customProducts',CUSTOM);
  if(cg){COMGROUPS[code]=cg;LS.set('comgroups',COMGROUPS);}
  const price=$('#np_price').value;
  if(price!==''){setItemPrice(code,price,$('#np_pricecur').value);}
  closeModal();
  document.getElementById('mTbody')&&(document.getElementById('mTbody').innerHTML=masterRows());render();
  toast('เพิ่ม '+code+' แล้ว','good');syncProduct(Object.assign({},p,{defaultPrice:price!==''?+price:null,defaultCur:$('#np_pricecur')?$('#np_pricecur').value:'USD'}));
}
function delProduct(code){CUSTOM=CUSTOM.filter(p=>p.code!==code);LS.set('customProducts',CUSTOM);delete PRICES[code];LS.set('prices',PRICES);render();toast('ลบ '+code,'good')}

async function backfillSalesDetail(){
  if(!cloudReady()){toast('ยังไม่ได้เชื่อมต่อ Google Sheet','bad');return}
  const list=QUOTES.filter(q=>!q.deleted);
  if(!list.length){toast('ไม่มีใบให้อัปเดต','bad');return}
  let done=0,fail=0;
  modal(`<div class="modal-h"><h3>กำลังสร้างข้อมูลสำหรับ Sales</h3></div>
    <div class="modal-b"><div id="bfMsg">เตรียมข้อมูล ${list.length} ใบ…</div>
      <div style="height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:10px">
        <i id="bfBar" style="display:block;height:100%;width:0%;background:var(--orange)"></i></div></div>`);
  for(let i=0;i<list.length;i++){
    const r=await postCloud(quotePayload(list[i]));
    if(r.ok)done++;else fail++;
    const el=document.getElementById('bfMsg'),bar=document.getElementById('bfBar');
    if(el)el.textContent='ส่งแล้ว '+(i+1)+'/'+list.length+' ใบ (สำเร็จ '+done+(fail?(' · ไม่สำเร็จ '+fail):'')+')';
    if(bar)bar.style.width=Math.round((i+1)/list.length*100)+'%';
  }
  closeModal();
  toast('สร้างข้อมูลสำหรับ Sales แล้ว '+done+' ใบ'+(fail?(' · ไม่สำเร็จ '+fail):''),fail?'bad':'good');
}

async function saveNewUser(){
  const name=($('#nu_name').value||'').trim(),email=($('#nu_email').value||'').trim().toLowerCase(),id=($('#nu_id').value||'').trim();
  const role=document.querySelector('#modalRoot select').value,pass=$('#nu_pass').value||'1234';
  const err=m=>{$('#nu_err').textContent=m};
  if(!name)return err('กรุณาใส่ชื่อ');
  if(!EMAIL_RE.test(email))return err('รูปแบบอีเมลไม่ถูกต้อง');
  if(!/^[A-Za-z0-9_.-]{2,40}$/.test(id))return err('Username ใช้ได้เฉพาะ a-z 0-9 _ . - (2–40 ตัว)');
  if(USERS.some(u=>u.id.toLowerCase()===id.toLowerCase()))return err('Username นี้มีอยู่แล้ว');
  if(USERS.some(u=>String(u.email||'').toLowerCase()===email))return err('อีเมลนี้มีผู้ใช้อยู่แล้ว');
  const u={id,name,email,role,active:true,scope:'all',passHash:await hashPass(pass)};
  USERS.push(u);LS.set('users',USERS);
  const r=await pushUsers();
  if(r&&userRejected(r)){USERS.splice(USERS.indexOf(u),1);LS.set('users',USERS);return err('Sheet ปฏิเสธ: '+(r.error||'-'))}
  closeModal();render();toast('เพิ่ม '+name+' ('+role+') แล้ว','good');
}

function scopeAll(uid,on){document.querySelectorAll('.scopeChk').forEach(c=>c.checked=on)}
function scopePreset(uid,kind){

function saveScope(uid){

async function saveMyPassword(){
  const old=$('#pw_old').value,n1=$('#pw_new').value,n2=$('#pw_new2').value;
  const ok=await verifyPass(CURRENT,old);
  if(!ok){$('#pw_err').textContent='รหัสผ่านปัจจุบันไม่ถูกต้อง';return}
  if(!n1||n1.length<4){$('#pw_err').textContent='รหัสใหม่ต้องอย่างน้อย 4 ตัว';return}
  if(n1!==n2){$('#pw_err').textContent='รหัสใหม่ทั้งสองช่องไม่ตรงกัน';return}
  const r=await changeOwnPassword(old,n1);

  closeModal();toast('เปลี่ยนรหัสผ่านเรียบร้อย','good');
}

/* ============================================================ GOOGLE SHEET SYNC (2-way, dual-mode) */
// When the app is SERVED BY Apps Script (/exec), google.script.run is available -> same-origin, no CORS, no URL needed.
// When hosted elsewhere, it falls back to fetch() against SETTINGS.cloudUrl.
function gsRun(){return !!(window.google&&window.google.script&&window.google.script.run)}
function cloudReady(){return gsRun()||!!(SETTINGS.cloudUrl&&SETTINGS.cloudUrl.startsWith('http'))}

function updateCloud(){
  const on=cloudReady();
  $('#cloudDot').className='cloud-dot'+(on?' on':'');
  $('#cloudTxt').textContent=gsRun()?'เชื่อมผ่าน Apps Script':(on?'เชื่อม Google Sheet':'ออฟไลน์ (เก็บในเครื่อง)');
}
function setCloudDot(state){const d=$('#cloudDot');if(!d)return;
  d.className='cloud-dot'+(state==='on'?' on':state==='err'?' err':state==='sync'?' sync':'');}

/* ---- offline queue (localStorage) ---- */
const SYNC_QUEUE_KEY='syncQueue';
function getQueue(){try{return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY)||'[]')}catch(e){return[]}}
function setQueue(q){try{localStorage.setItem(SYNC_QUEUE_KEY,JSON.stringify(q))}catch(e){}}
function enqueueSync(payload){const q=getQueue();q.push({payload,at:Date.now(),tries:0});if(q.length>500)q.shift();setQueue(q);
  if(typeof updateQueueBadge==='function')updateQueueBadge();}
function queueLen(){return getQueue().length}

/* ---- unified POST: google.script.run if served by Apps Script, else fetch (text/plain = no CORS preflight) ---- */
// 2.9: hard 15s timeout so a hung request can never freeze the sync button
const CLOUD_TIMEOUT_MS=15000;
function withTimeout(promise,ms){
  return new Promise(resolve=>{
    let done=false;
    const t=setTimeout(()=>{if(!done){done=true;resolve({ok:false,error:'timeout '+(ms/1000)+'s',timeout:true})}},ms||CLOUD_TIMEOUT_MS);
    promise.then(r=>{if(!done){done=true;clearTimeout(t);resolve(r)}},e=>{if(!done){done=true;clearTimeout(t);resolve({ok:false,error:String(e)})}});
  });
}
async function postCloud(payload){
  const r=await withTimeout(_postCloud(payload),CLOUD_TIMEOUT_MS);
  if(r&&!r.ok&&r.error==='AUTH_REQUIRED'&&payload.action!=='login')onAuthExpired();
  return r;
}
async function cloudGet(type,arg){
  const r=await withTimeout(_cloudGet(type,arg),CLOUD_TIMEOUT_MS);
  if(r&&r.ok===false&&r.error==='AUTH_REQUIRED')onAuthExpired();
  return r;
}
/* v4.1: เซสชันหมดอายุ (SESSION_HOURS ใน Code.gs) — เดิมเงียบ แค่จุดเมฆเป็นสีแดง
   ผู้ใช้จึงเห็นข้อมูลเก่าค้างจอโดยไม่รู้ตัว → ตอนนี้แจ้งชัด ๆ ครั้งเดียว แล้วพาไปล็อกอินใหม่
   (รายการที่ค้างในคิวยังอยู่ และจะถูกส่งด้วย token ใหม่หลังล็อกอิน) */
let _authWarned=false;
function onAuthExpired(){
  if(_authWarned||!CURRENT)return;
  _authWarned=true;stopLive();
  modal(`<div class="modal-h"><h3 style="color:var(--amber)">⏱ เซสชันหมดอายุ</h3><div class="spacer"></div></div>
  <div class="modal-b"><p style="line-height:1.8;font-size:13.5px">ระบบไม่สามารถดึง/บันทึกข้อมูลจาก Google Sheet ได้ เพราะเซสชันหมดอายุแล้ว<br>
    <b>ข้อมูลที่ยังไม่ได้ส่งจะถูกเก็บไว้ในคิว</b> และส่งให้อัตโนมัติหลังเข้าสู่ระบบใหม่</p></div>
  <div class="modal-f"><button class="btn" onclick="closeModal();autosaveDraft();dirty=false;logout()">เข้าสู่ระบบใหม่</button></div>`);
}
async function _postCloud(payload){
  // FIX v4.1: เดิมเขียน token ลงใน payload ตัวเดียวกับที่อยู่ในคิว → หลังเซสชันหมดอายุ ทุกรายการในคิว
  //           ส่งซ้ำด้วย token เก่าจนครบ 12 ครั้งแล้วถูกทิ้ง (ข้อมูลหาย) → ตอนนี้ใช้สำเนา + token ปัจจุบันเสมอ
  payload=Object.assign({},payload);
  if(SESSION_TOKEN)payload.token=SESSION_TOKEN;
  if(gsRun()){
    return new Promise(resolve=>{
      try{ google.script.run
        .withSuccessHandler(r=>{let d=null;try{d=(typeof r==='string')?JSON.parse(r):r}catch(e){d=null}
          resolve((d&&d.ok===false)?{ok:false,error:d.error,data:d}:{ok:true,data:d})})
        .withFailureHandler(e=>resolve({ok:false,error:(e&&e.message)||String(e)}))
        .apiPost(JSON.stringify(payload));
      }catch(e){resolve({ok:false,error:String(e)})}
    });
  }
  if(!SETTINGS.cloudUrl||!SETTINGS.cloudUrl.startsWith('http'))return {ok:false,offline:true};
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const killer=ac?setTimeout(()=>ac.abort(),CLOUD_TIMEOUT_MS):null;
  try{
    const res=await fetch(SETTINGS.cloudUrl,{method:'POST',redirect:'follow',signal:ac?ac.signal:undefined,
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    if(killer)clearTimeout(killer);
    if(!res.ok)return {ok:false,error:'HTTP '+res.status};
    let data=null;try{data=await res.json()}catch(e){data=null}
    if(data&&data.ok===false)return {ok:false,error:data.error||'server error',data};
    return {ok:true,data};
  }catch(e){if(killer)clearTimeout(killer);return {ok:false,error:(e&&e.name==='AbortError')?'timeout':(e.message||String(e))}}
}
/* ---- unified GET ---- */
// arg = id (type 'quote') หรือ since (type 'changes') — ต้องใช้ Code.gs v4.1 ขึ้นไป
async function _cloudGet(type,arg){
  if(gsRun()){
    return new Promise(resolve=>{
      try{ google.script.run
        .withSuccessHandler(r=>{try{resolve((typeof r==='string')?JSON.parse(r):r)}catch(e){resolve(null)}})
        .withFailureHandler(()=>resolve(null))
        .apiGet(type||'quotations',SESSION_TOKEN||'',arg==null?'':String(arg));
      }catch(e){resolve(null)}
    });
  }
  if(!SETTINGS.cloudUrl||!SETTINGS.cloudUrl.startsWith('http'))return null;
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const killer=ac?setTimeout(()=>ac.abort(),CLOUD_TIMEOUT_MS):null;
  const argQ=arg==null||arg===''?'':((type==='quote'?'&id=':'&since=')+encodeURIComponent(arg));
  try{const res=await fetch(SETTINGS.cloudUrl+'?type='+(type||'quotations')+(SESSION_TOKEN?('&token='+encodeURIComponent(SESSION_TOKEN)):'')+argQ,{redirect:'follow',signal:ac?ac.signal:undefined});
    if(killer)clearTimeout(killer);return await res.json();}catch(e){if(killer)clearTimeout(killer);return null}
}
/* ============================================================ 2.8 USERS SYNC (Users tab) */
// BUSINESS RULE: only id/name/role/scope/passHash are pushed — never a plaintext password.
async function pushUsers(showToast){
  if(!cloudReady()){if(showToast)toast('ยังไม่ได้เชื่อมต่อ Google Sheet','bad');return {ok:false,offline:true}}

      scope:(u.scope==='all'||!u.scope)?'all':u.scope,passHash:u.passHash||''})))};
  const r=await postCloud(payload);
  const USER_ERR={DUPLICATE_EMAIL:'อีเมลนี้ถูกใช้กับผู้ใช้อื่นแล้ว',BAD_EMAIL:'รูปแบบอีเมลไม่ถูกต้อง',ACCESS_DENIED:'ต้องเป็น Admin / GM จึงแก้ผู้ใช้ได้'};
  if(showToast||(!r.ok&&USER_ERR[r.error]))toast(r.ok?'ซิงค์ผู้ใช้ขึ้น Sheet แล้ว':'ซิงค์ผู้ใช้ไม่สำเร็จ: '+(USER_ERR[r.error]||r.error||'-')+((r.data&&r.data.email)?' ('+r.data.email+')':''),r.ok?'good':'bad');
  if(!r.ok&&!USER_ERR[r.error])enqueueSync(payload);   // ข้อมูลผิดรูปแบบไม่ต้องเข้าคิวส่งซ้ำ
  return r;

async function pullUsers(){
  const d=await cloudGet('users');
  const rows=(d&&(d.users||d.rows))||[];
  if(!rows.length)return 0;
  let changed=0;
  rows.forEach(r=>{
    if(!r||!r.id)return;
    let scope=r.scope;
    if(typeof scope==='string'&&scope!=='all'){try{scope=JSON.parse(scope)}catch(e){scope=scope?scope.split(',').map(x=>x.trim()).filter(Boolean):'all'}}
    const u=USERS.find(x=>x.id===r.id);
    if(!u){USERS.push({id:r.id,name:r.name||r.id,role:normRole(r.role||'Sales'),email:r.email||'',active:r.active!==false,scope:scope||'all',passHash:r.passHash||''});changed++;}
    else{
      if(r.name&&u.name!==r.name){u.name=r.name;changed++;}
      if(r.role&&u.role!==normRole(r.role)){u.role=normRole(r.role);changed++;}
      if(scope&&JSON.stringify(u.scope)!==JSON.stringify(scope)){u.scope=scope;changed++;}
      if(r.passHash&&u.passHash!==r.passHash){u.passHash=r.passHash;delete u.pass;changed++;}
      if(r.email!==undefined&&(u.email||'')!==r.email){u.email=r.email;changed++;}
      if(r.active!==undefined&&(u.active!==false)!==(r.active!==false)){u.active=r.active!==false;changed++;}
    }
  });
  if(changed){LS.set('users',USERS);initLogin();}
  return changed;
}

/* ============================================================ SALES DATA PROJECTION
   สร้าง "สำเนาปลอดต้นทุน" ของใบเสนอราคา เก็บลงคอลัมน์ SalesDetail
   แอปฝั่ง Sales จะได้รับเฉพาะก้อนนี้ ไม่เคยได้รับ Detail ตัวเต็มเลย
   → ต้นทุน / %GP / ค่า Duty / Clearance / สกุลเงินต้นทุน ไม่เคยออกจาก server ไปหา Sales
   ============================================================ */
function buildSalesProjection(q){
  const H=q.header||{};
  const base={
    id:q.id,_v:2,_sv:3,docType:q.docType||'QT',docNo:q.docNo||'',round:q.round||1,
    status:q.status||'',followStatus:q.followStatus||'',
    releasedTo:(q.releasedTo||[]).slice(),releasedAt:q.releasedAt||'',
    assignedTo:q.assignedTo||null,srId:q.srId||null,quoteIds:(q.quoteIds||[]).slice(),
    created:q.created||'',updated:q.updated||'',updatedAt:q.updatedAt||'',
    salesNote:q.salesNote||'',followUpDate:q.followUpDate||'',
    salesUpdate:q.salesUpdate||null,salesUpdatedAt:q.salesUpdatedAt||'',
    header:{ref:H.ref||'',title:H.title||'',customer:H.customer||'',project:H.project||'',
      sales:H.sales||'',salesUserId:H.salesUserId||null,groupType:H.groupType||'',
      currency:H.currency||'',priceTerm:H.priceTerm||'',incoterm:H.incoterm||'',
      offerDate:H.offerDate||'',validity:H.validity||30,reqDate:H.reqDate||'',needBy:H.needBy||''},
    remarks:(q.remarks||[]).slice(),
    lines:[],total:0,extrasTotal:0
  };
  if(q.docType==='SR'){
    base.lines=(q.lines||[]).map(L=>({code:L.code||'',desc:L.desc||'',group:L.group||'',
      uom:L.uom||'',qty:+L.qty||0,targetUp:+L.targetUp||0,salesNote:L.salesNote||'',
      warranty:L.warranty||'',lead:L.lead||'',deliveryDate:L.deliveryDate||''}));
    return base;
  }
  const t=computeQuote(q);
  const gradeByCat={};                               // S2.2: เกรดตัวอักษรต่อหมวด (ไม่มี %GP/rate)
  Object.keys(t.com||{}).forEach(c=>{gradeByCat[c]=t.com[c].grade;});
  base.lines=t.lines.map(o=>({code:o.L.code||'',desc:o.L.desc||'',group:o.L.group||'',
    uom:o.L.uom||'',qty:+o.L.qty||0,
    unitPrice:o.totalUP,amount:o.lineTotal,          // ราคาขายเท่านั้น ไม่มีต้นทุน
    comGrade:gradeByCat[o.L.comGroup||comCategory(o.L.group)]||'',   // ตัวอักษรเกรดตามกลุ่มสินค้า (ไม่มีตัวเลข)
    warranty:o.L.warranty||'',lead:o.L.lead||'',deliveryDate:o.L.deliveryDate||'',
    targetUp:+o.L.targetUp||0,customerRemark:o.L.customerRemark||''}));
  base.extrasTotal=t.globalExtras;                   // ยอดรวมค่าใช้จ่ายเพิ่ม (ไม่แตกรายการต้นทุน)
  base.total=t.total;
  return base;
}
function quotePayload(q){
  const t=quoteTotals(q);
  // ฟิลด์ชั่วคราวฝั่ง client (สถานะ sync / conflict) ไม่ต้องลง Sheet
  const clean=Object.assign({},q);TRANSIENT_KEYS.forEach(k=>delete clean[k]);
  let detail=JSON.stringify(clean);
  // BUSINESS RULE: Google Sheets cells cap at ~50,000 chars; strip audit trail to last 20 entries if detail exceeds 45,000
  // TODO(schema-v3): store auditLogs in a separate sheet row
  if(detail.length>45000){const s=Object.assign({},clean,{auditLogs:(q.auditLogs||[]).slice(-20)});detail=JSON.stringify(s);}
  return {action:'save',id:q.id,docType:q.docType||'QT',docNo:q.docNo||'',status:q.status||'',
    needsApproval:q.needsApproval?1:0,releasedTo:(q.releasedTo||[]).join('|'),
    salesUserId:(q.header&&q.header.salesUserId)||'',assignedTo:q.assignedTo||'',
    ref:q.header.ref,title:q.header.title,customer:q.header.customer,
    sales:q.header.sales,group:q.header.groupType,round:q.round,currency:q.header.currency,incoterm:q.header.incoterm,
    priceTerm:q.header.priceTerm,exrate:q.header.exrate,offerDate:q.header.offerDate,stage:q.stage,
    followStatus:q.followStatus,salesNote:q.salesNote||'',total:t.total,cost:t.cost,profit:t.profit,gp:t.gp,
    lines:q.lines.length,updated:q.updated,by:CURRENT?CURRENT.name:'-',detail,
    // v4.1 conflict guard: UpdatedAt ของ Sheet ที่ใบนี้อ้างอิงอยู่ — server ปฏิเสธ (409) ถ้ามีคนเขียนหลังจากนั้น
    baseUpdatedAt:q._cloudAt||'',
    salesDetail:JSON.stringify(buildSalesProjection(q)).slice(0,45000)};
}
async function syncCloud(q,opts){
  if(!cloudReady()){q.isSynced=false;persistQuote(q);return {ok:false,offline:true}}
  const force=!!((opts&&opts.force)||q._forceSave);delete q._forceSave;
  const payload=quotePayload(q);
  if(force)payload.force=true;
  setCloudDot('sync');
  const res=await postCloud(payload);
  if(res.ok){ q.isSynced=true; delete q._conflict; delete q._cloudNewer; delete q._cloudNewerBy;
    if(res.data&&res.data.updatedAt)q._cloudAt=res.data.updatedAt;      // baseline ใหม่สำหรับการบันทึกครั้งถัดไป
    persistQuote(q); setCloudDot('on'); }
  else if(res.error==='CONFLICT'){                                        // มีคนเขียนบน Sheet ก่อนเรา → ห้ามเข้าคิวส่งซ้ำ
    q.isSynced=false; q._conflict=res.data||{}; persistQuote(q); setCloudDot('err');
    conflictModal(q.id,res.data||{});
  }
  else{ q.isSynced=false; persistQuote(q); enqueueSync(payload);
    if(!res.offline)toast('บันทึกขึ้น Google Sheet ไม่สำเร็จ: '+(res.error||'-')+' (เก็บคิวไว้ส่งภายหลัง กด 🔄 ซิงค์ เพื่อลองใหม่)','bad');
    setCloudDot(res.offline?'':'err'); }
  return res;
}
function persistQuote(q){const i=QUOTES.findIndex(x=>x.id===q.id);if(i>=0)QUOTES[i]=q;LS.set('quotes',QUOTES)}

/* ---- replay any queued saves ---- */
let _flushing=false,_flushTimer=null,_flushDelay=5000;
async function flushQueue(){
  if(_flushing)return;
  if(!cloudReady())return;
  let q=getQueue();if(!q.length){updateQueueBadge();return}
  _flushing=true;
  // v4.1: ใบเดียวกันถูกบันทึกหลายครั้งตอนออฟไลน์ → ส่งเฉพาะครั้งล่าสุด (detail เต็มใบ ครั้งหลังครอบคลุมครั้งก่อนเสมอ)
  //       ไม่งั้นครั้งที่ 2 จะชน conflict guard ของครั้งที่ 1 ที่เพิ่งส่งสำเร็จ
  const lastSave={};q.forEach((it,i)=>{if(it.payload&&it.payload.action==='save')lastSave[it.payload.id]=i;});
  q=q.filter((it,i)=>!(it.payload&&it.payload.action==='save'&&lastSave[it.payload.id]!==i));
  const remain=[];let done=0,conflicts=[];
  for(const item of q){
    const tries=(item.tries||0);
    const r=await postCloud(item.payload);
    const tid=item.payload.id;const lq=QUOTES.find(x=>x.id===tid);
    if(r.ok){done++;
      if(lq){lq.isSynced=true;delete lq._conflict;delete lq._cloudNewer;delete lq._cloudNewerBy;if(r.data&&r.data.updatedAt)lq._cloudAt=r.data.updatedAt;}}
    else if(r.error==='CONFLICT'){        // ไม่ส่งซ้ำ — ให้ผู้ใช้ตัดสินใจเอง (โหลดของ Cloud / บันทึกทับ)
      if(lq){lq.isSynced=false;lq._conflict=r.data||{};}conflicts.push(tid);}
    else {item.tries=tries+1;
      // BUSINESS RULE: drop an item after 12 failed attempts so a poisoned payload can't block the queue forever
      if(item.tries<=12)remain.push(item);}
  }
  if(conflicts.length){toast('มี '+conflicts.length+' ใบที่ข้อมูลบน Cloud ถูกแก้โดยคนอื่นระหว่างออฟไลน์ — เปิดใบเพื่อเลือกเวอร์ชัน','bad');
    conflictModal(conflicts[0],(QUOTES.find(x=>x.id===conflicts[0])||{})._conflict||{});}
  setQueue(remain);if(done)LS.set('quotes',QUOTES);
  updateQueueBadge();
  _flushing=false;
  if(done&&!remain.length){toast('ซิงค์รายการค้าง '+done+' รายการสำเร็จ','good');setCloudDot('on');_flushDelay=5000;}
  else if(remain.length){setCloudDot('err');scheduleFlush();}
}
/* 2.9: exponential backoff retry (5s → 10s → … → max 5 min) */
function scheduleFlush(){
  if(_flushTimer)clearTimeout(_flushTimer);
  _flushDelay=Math.min(_flushDelay*2,300000);
  _flushTimer=setTimeout(()=>{_flushTimer=null;flushQueue()},_flushDelay);
}
function updateQueueBadge(){
  const b=$('#queueBadge');if(!b)return;
  const n=queueLen();
  if(n>0){b.style.display='';b.textContent='⏳ ค้าง '+n;b.title=n+' รายการรอส่งขึ้น Google Sheet';}
  else{b.style.display='none';b.textContent='';}
}
window.addEventListener('online',()=>{_flushDelay=5000;toast('กลับมาออนไลน์ — กำลังส่งรายการค้าง','good');flushQueue();});
window.addEventListener('offline',()=>{setCloudDot('');updateQueueBadge();});

/* ============================================================ LIVE SYNC (v4.1)
   หลักการ: Google Sheet คือความจริงหนึ่งเดียว · localStorage เป็นแค่ cache + คิวออฟไลน์
   1) mergeRemoteRow()   — กติกาการรวมข้อมูล "ที่เดียว" ใช้ทั้งตอนเปิดแอป / polling / เปิดดูใบ
   2) refreshQuote(id)   — เปิดดู/แก้ใบไหน ดึงใบนั้นจาก Cloud เบื้องหลังทันที ถ้าใหม่กว่า → อัปเดตจอ
   3) pollChanges()      — หน้า Dashboard / บอร์ดทีมขาย ดึงเฉพาะแถวที่เปลี่ยนทุก 30 วินาที (type=changes)
   4) Conflict           — _cloudAt = UpdatedAt ของ Sheet ที่ใบในเครื่องอ้างอิง · ส่งเป็น baseUpdatedAt ตอนบันทึก
                           server ปฏิเสธ (409) ถ้ามีคนเขียนหลังจากนั้น + หน้าแก้ไขเตือนล่วงหน้าทุก 30 วินาที
   ============================================================ */
// BUSINESS RULE: ความถี่ auto-sync (ปรับได้) — 30 วินาทีเบาพอสำหรับ quota ของ Apps Script
const LIVE_POLL_MS=30000;
const LIVE_POLL_ROUTES=['dashboard','salessummary'];   // หน้าที่ polling รายการทั้งหมด
const LIVE_OVERLAP_MS=90000;      // ขอข้อมูลซ้อนย้อนหลัง 90 วิ กันแถวที่เขียนระหว่างอ่านหลุด (merge ซ้ำได้ปลอดภัย)
const LEGACY_FULL_PULL_MS=120000; // Code.gs รุ่นเก่า (ไม่มี type=changes) → ดึงทั้งชุดห่างขึ้นเป็น 2 นาที
let _liveTimer=null,_lastServerTime='',_polling=false,_lastPollAt=0,_lastFullPull=0;
let _editConflict=null,_renderPending=false,_flashIds={};
const TRANSIENT_KEYS=['_conflict','_cloudNewer','_cloudNewerBy','_forceSave','_cloudAt','_cloudBy'];

/* แถวจาก server → ใบเสนอราคาในเครื่อง (null = ข้ามแถวนี้) */
function remoteFromRow(row){
  let remote=null;try{remote=(row&&row.detail)?JSON.parse(row.detail):null}catch(e){remote=null}
  // FIX v4.1: Detail ที่ใหญ่เกิน cell ถูกเก็บเป็น {id,_oversize:true} → เดิม migrateQuote() พังที่ q.header
  //           แล้ว exception ทำให้ "ทั้งรอบ" ไม่มีใบไหนถูกอัปเดตเลย — ตอนนี้ข้ามเฉพาะใบนั้น
  if(!remote||!remote.id||remote._oversize||!remote.header)return null;
  try{remote=migrateQuote(remote)}catch(e){return null}
  TRANSIENT_KEYS.forEach(k=>delete remote[k]);
  remote.isSynced=true;
  remote._cloudAt=row.updatedAt||remote.updatedAt||'';
  if(row.by)remote._cloudBy=row.by;
  return remote;
}
/* กติกาการรวม — คืน 'added' | 'merged' | 'kept-local' | 'same' | null */
function mergeRemoteRow(row,opts){
  const remote=remoteFromRow(row);if(!remote)return null;
  const i=QUOTES.findIndex(x=>x.id===remote.id);
  // FIX v4.1: เดิมใบที่ถูกลบบน Cloud แต่ไม่มีในเครื่อง ไปเข้า else แล้วอ่าน QUOTES[-1] → crash ทั้งรอบการ sync
  if(i<0){if(remote.deleted)return null;QUOTES.push(remote);return 'added'}
  const local=QUOTES[i];
  if(opts&&opts.force){QUOTES[i]=remote;return 'merged'}
  const rt=Date.parse(remote._cloudAt)||0;
  if(local.isSynced===false){
    // ในเครื่องมีงานที่ยังไม่ได้ส่ง → ไม่ทับ แต่จำไว้ว่า Cloud ใหม่กว่า (ใช้เตือน conflict)
    if(local._cloudAt&&rt>(Date.parse(local._cloudAt)||0)+1000){local._cloudNewer=remote._cloudAt;local._cloudNewerBy=row.by||'';return 'kept-local'}
    return 'same';
  }
  const lt=Date.parse(local._cloudAt||local.updatedAt||local.updated||'')||0;
  if(rt>lt){QUOTES[i]=remote;return 'merged'}
  if(!local._cloudAt&&remote._cloudAt)local._cloudAt=remote._cloudAt;   // ใบเก่า: ตั้ง baseline ให้ conflict guard
  return 'same';
}

/* ---- startup / manual: ดึงทั้งชุด ---- */
async function initializeData(){
  if(!cloudReady()){setCloudDot('');return {ok:false,offline:true}}
  // pull settings first so newer commission/defaults from another device take effect before quotes render
  try{await pullUsers();}catch(e){/* non-fatal */}
  try{const sd=await cloudGet('settings');
    if(sd&&sd.settingsRev&&+sd.settingsRev>(SETTINGS.settingsRev||0)){
      const merged=Object.assign({},SETTINGS,sd,{cloudUrl:SETTINGS.cloudUrl});
      SETTINGS=merged;LS.set('settings',SETTINGS);}}catch(e){/* non-fatal */}
  setCloudDot('sync');
  let result={ok:false,added:0,merged:0};
  try{
    const data=await cloudGet('quotations');
    const rows=(data&&(data.quotations||data.rows))||[];
    let added=0,merged=0;
    rows.forEach(row=>{const r=mergeRemoteRow(row);if(r==='added')added++;else if(r==='merged')merged++;});
    QUOTES.forEach(q=>{if(q.isSynced==null)q.isSynced=true});
    LS.set('quotes',QUOTES);
    _lastFullPull=Date.now();
    _lastServerTime=(data&&data.serverTime)||'';          // ว่าง = Code.gs รุ่นเก่า → polling แบบดึงทั้งชุด
    if(added+merged>0){renderNav();liveRender();toast('ดึงจาก Google Sheet: ใหม่ '+added+' · อัปเดต '+merged,'good');}
    setCloudDot(data&&data.ok!==false?'on':'err');setLiveStamp();
    result={ok:!!data&&data.ok!==false,added,merged};
  }catch(e){setCloudDot('err');/* keep local data, silent */}
  updateQueueBadge();
  flushQueue();
  return result;
}
let _syncing=false;
async function manualSync(){
  if(_syncing)return;
  if(!cloudReady()){toast('ยังไม่ได้เชื่อมต่อ Google Sheet','bad');return}
  _syncing=true;const b=$('#syncBtn');if(b){b.disabled=true;b.textContent='⏳ ซิงค์...';}
  setCloudDot('sync');
  await flushQueue();                 // push my pending saves first
  const r=await initializeData();     // then pull everyone's latest
  if(b){b.disabled=false;b.textContent='🔄 ซิงค์';}
  updateQueueBadge();
  _syncing=false;
  if(r&&r.ok&&(r.added+r.merged)===0)toast('ข้อมูลเป็นเวอร์ชันล่าสุดแล้ว','good');
  else if(r&&!r.ok)toast('ซิงค์ไม่สำเร็จ — ตรวจการเชื่อมต่อในหน้าตั้งค่า','bad');
}

/* ---- ใบเดียว: เปิดดู / เปิดแก้ / ก่อนอัปเดตแทน Sales ---- */
async function refreshQuote(id,opts){
  if(!id||!cloudReady())return null;
  const d=await cloudGet('quote',id);
  if(!d||d.ok===false)return null;                         // ออฟไลน์ / Code.gs รุ่นเก่า → ใช้ข้อมูลในเครื่องต่อ
  if(!d.quote)return {status:'missing',row:null};
  const res=mergeRemoteRow(d.quote,opts);
  if(res==='added'||res==='merged'){LS.set('quotes',QUOTES);_flashIds[id]=Date.now();}
  setLiveStamp();
  return {status:res,row:d.quote};
}
async function refreshPreview(id){
  const el=document.getElementById('qLive');
  if(el)el.innerHTML='<span class="live-spin"></span> ตรวจข้อมูลล่าสุด…';
  const before=QUOTES.find(x=>x.id===id),prevSt=before?statusOf(before):null;
  const r=await refreshQuote(id);
  if(route!=='preview'||previewId!==id)return;
  if(r&&(r.status==='merged'||r.status==='added')){
    const q=QUOTES.find(x=>x.id===id);
    liveRender();
    toast(q&&prevSt&&statusOf(q)!==prevSt?('🔔 สถานะเปลี่ยน: '+(STATUS_TH[prevSt]||prevSt)+' → '+(STATUS_TH[statusOf(q)]||statusOf(q))):'อัปเดตเป็นข้อมูลล่าสุดจาก Cloud แล้ว','good');
    return;
  }
  const el2=document.getElementById('qLive');
  if(el2)el2.innerHTML=r?(r.status==='kept-local'
      ?'<span style="color:var(--amber)">⚠ Cloud มีเวอร์ชันใหม่กว่า แต่ในเครื่องมีงานที่ยังไม่ได้ส่ง</span>'
      :'☁ ข้อมูลล่าสุดแล้ว · '+fmtTime(new Date().toISOString()))
    :'<span class="hint">ใช้ข้อมูลในเครื่อง (ออฟไลน์)</span>';
}

/* ---- Dashboard polling: ดึงเฉพาะที่เปลี่ยน ---- */
async function pollChanges(force){
  if(_polling||!CURRENT||_authWarned||!cloudReady())return;
  if(document.hidden&&!force)return;                       // แท็บไม่ได้เปิดอยู่ = ไม่เปลือง quota
  if(!force&&Date.now()-_lastPollAt<8000)return;
  _polling=true;_lastPollAt=Date.now();
  try{
    let data;
    if(_lastServerTime){
      const since=new Date((Date.parse(_lastServerTime)||Date.now())-LIVE_OVERLAP_MS).toISOString();
      data=await cloudGet('changes',since);
      if(data&&data.ok===false&&data.error!=='AUTH_REQUIRED'){_lastServerTime='';data=null;}   // server ไม่รองรับ → โหมดดึงทั้งชุด
    }else{
      if(Date.now()-_lastFullPull<LEGACY_FULL_PULL_MS)return;
      data=await cloudGet('quotations');_lastFullPull=Date.now();
    }
    if(!data||data.ok===false){setCloudDot('err');return}
    if(data.serverTime)_lastServerTime=data.serverTime;
    const changes=[];
    (data.quotations||data.rows||[]).forEach(row=>{
      const prev=QUOTES.find(x=>x.id===row.id),prevSt=prev?statusOf(prev):null;
      const r=mergeRemoteRow(row);
      if(r==='added'||r==='merged'){const q=QUOTES.find(x=>x.id===row.id);if(q){changes.push({q,prevSt});_flashIds[q.id]=Date.now();}}
    });
    if(changes.length){LS.set('quotes',QUOTES);renderNav();liveRender();announceChanges(changes);}
    setCloudDot('on');setLiveStamp();
  }finally{_polling=false}
}
function announceChanges(changes){
  const moved=changes.filter(c=>c.prevSt&&c.q.docType!=='SR'&&statusOf(c.q)!==c.prevSt);
  if(moved.length===1){const c=moved[0];
    toast('🔔 '+(c.q.docNo||c.q.header.ref||'')+': '+(STATUS_TH[c.prevSt]||c.prevSt)+' → '+(STATUS_TH[statusOf(c.q)]||statusOf(c.q)),'good');}
  else if(moved.length>1)toast('🔔 สถานะเปลี่ยน '+moved.length+' ใบ (อัปเดตอัตโนมัติจาก Cloud)','good');
  else toast('↻ อัปเดตข้อมูลล่าสุดจาก Cloud '+changes.length+' ใบ','good');
}
/* วาดหน้าจอใหม่หลังข้อมูลเปลี่ยน โดยไม่ขัดจังหวะผู้ใช้ */
function liveRender(){
  if(!CURRENT)return;
  if(route==='new'){renderConflictBanner();return}          // หน้าแก้ไข: ห้ามทับสิ่งที่กำลังพิมพ์ — แค่เตือน
  if($('#modalRoot').innerHTML){_renderPending=true;return} // มี modal เปิดอยู่ → วาดหลังปิด
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&$('#content').contains(ae)){_renderPending=true;return}
  _renderPending=false;
  const y=window.scrollY;render();window.scrollTo(0,y);
}
function isFlash(id){return _flashIds[id]&&(Date.now()-_flashIds[id]<6000)}
function setLiveStamp(){
  const el=$('#liveTxt');if(!el)return;
  const live=LIVE_POLL_ROUTES.indexOf(route)>=0;
  el.className='live-pill'+(live?' on':'');
  el.textContent=(live?'● Live · ':'')+'อัปเดต '+fmtTime(new Date().toISOString()).slice(-5);
  el.title=live?('หน้านี้อัปเดตอัตโนมัติทุก '+(LIVE_POLL_MS/1000)+' วินาที'):'เวลาที่ดึงข้อมูลจาก Cloud ล่าสุด';
}
function liveTick(){
  if(!CURRENT||_authWarned)return;
  if(LIVE_POLL_ROUTES.indexOf(route)>=0)pollChanges();
  else if(route==='new')checkEditingFresh(false);
  else if(route==='preview'&&previewId&&!document.hidden)refreshPreview(previewId);
}
function startLive(){stopLive();_liveTimer=setInterval(liveTick,LIVE_POLL_MS)}
function stopLive(){if(_liveTimer){clearInterval(_liveTimer);_liveTimer=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CURRENT)liveTick()});

/* ---- หน้าแก้ไข: ตรวจว่ามีคนแก้ใบเดียวกันบน Cloud ไปแล้วหรือยัง ---- */
async function checkEditingFresh(onOpen){
  if(!editing||route!=='new'||document.hidden&&!onOpen)return;
  const id=editing.id;
  const r=await refreshQuote(id);
  if(!r||!r.row||route!=='new'||!editing||editing.id!==id)return;
  const cloudAt=Date.parse(r.row.updatedAt||'')||0;
  if(!editing._cloudAt){if(!dirty)editing._cloudAt=r.row.updatedAt;return}
  if(cloudAt<=(Date.parse(editing._cloudAt)||0)+1000)return;
  if(onOpen&&!dirty){                          // เพิ่งเปิด ยังไม่ได้แก้อะไร → ใช้เวอร์ชันล่าสุดให้เลย
    const fresh=QUOTES.find(x=>x.id===id);
    if(fresh){editing=JSON.parse(JSON.stringify(fresh));render();toast('โหลดเวอร์ชันล่าสุดจาก Cloud แล้ว','good');}
    return;
  }
  _editConflict={id,at:r.row.updatedAt,by:r.row.by||'',status:r.row.status||''};
  renderConflictBanner();
}
function renderConflictBanner(){
  const box=document.getElementById('conflictBanner');if(!box)return;
  const c=_editConflict;
  if(!c||!editing||c.id!==editing.id){box.innerHTML='';return}
  box.innerHTML=`<div class="conflict-bar">
    <span style="font-size:20px">⚠️</span>
    <div style="flex:1;min-width:220px"><b>ข้อมูลบน Cloud มีการเปลี่ยนแปลง</b>
      <div class="hint">ใบนี้ถูกแก้โดย <b>${esc(c.by||'ผู้ใช้อื่น')}</b> เมื่อ ${esc(fmtTime(c.at))}${c.status?(' · สถานะบน Cloud: <b>'+esc(STATUS_TH[c.status]||c.status)+'</b>'):''}
        หลังจากที่คุณเปิดหน้านี้ — ถ้าบันทึกตอนนี้จะทับงานของอีกฝ่าย</div></div>
    <button class="btn sm" onclick="resolveConflict('${esc(c.id)}','cloud')">↺ โหลดเวอร์ชัน Cloud (ทิ้งที่แก้)</button>
    <button class="btn sm ghost" onclick="keepMineOnSave()">เก็บของฉัน · บันทึกทับตอนกดบันทึก</button></div>`;
}
function keepMineOnSave(){
  if(!editing)return;
  editing._forceSave=true;editing._cloudAt=(_editConflict&&_editConflict.at)||editing._cloudAt;
  _editConflict=null;renderConflictBanner();
  toast('ตกลง — เมื่อกดบันทึก ระบบจะบันทึกทับเวอร์ชันบน Cloud (บันทึกในประวัติ)','good');
}
function conflictModal(id,info){
  const q=QUOTES.find(x=>x.id===id);
  const nm=q?(q.docNo||(q.header&&q.header.ref)||''):id;
  modal(`<div class="modal-h"><h3 style="color:var(--amber)">⚠️ ข้อมูลบน Cloud ถูกแก้ไขโดยคนอื่น</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b"><p style="line-height:1.85;font-size:13.5px">ใบ <b>${esc(nm)}</b> ถูกแก้บน Google Sheet โดย <b>${esc(info.serverBy||'ผู้ใช้อื่น')}</b>
    เมื่อ ${esc(fmtTime(info.serverUpdatedAt))}${info.serverStatus?(' (สถานะ <b>'+esc(STATUS_TH[info.serverStatus]||info.serverStatus)+'</b>)'):''}
    หลังจากที่เครื่องนี้ดึงข้อมูลครั้งล่าสุด</p>
    <p class="hint" style="margin-top:8px">ระบบ <b>ยังไม่ได้บันทึกทับ</b> เพื่อกันงานของอีกฝ่ายหาย (เช่น การอนุมัติ / ปล่อยราคา / อัปเดตจาก Sales) — เลือกเวอร์ชันที่จะใช้</p></div>
  <div class="modal-f"><button class="btn ghost" onclick="closeModal()">ตัดสินใจทีหลัง</button>
    <button class="btn ghost" onclick="resolveConflict('${esc(id)}','mine')">บันทึกทับด้วยเวอร์ชันของฉัน</button>
    <button class="btn" onclick="resolveConflict('${esc(id)}','cloud')">↺ ใช้เวอร์ชันบน Cloud</button></div>`);
}
async function resolveConflict(id,mode){
  closeModal();
  if(mode==='cloud'){
    const r=await refreshQuote(id,{force:true});
    if(!r||!r.row){toast('ดึงข้อมูลจาก Cloud ไม่สำเร็จ — ลองใหม่','bad');return}
    setQueue(getQueue().filter(it=>!(it.payload&&it.payload.id===id&&it.payload.action==='save')));updateQueueBadge();
    if(editing&&editing.id===id){const fresh=QUOTES.find(x=>x.id===id);editing=fresh?JSON.parse(JSON.stringify(fresh)):null;dirty=false;clearDraft();}
    _editConflict=null;renderNav();render();toast('ใช้เวอร์ชันล่าสุดจาก Cloud แล้ว','good');
    return;
  }
  const q=(editing&&editing.id===id)?editing:QUOTES.find(x=>x.id===id);if(!q)return;
  logAction(q.id,'Overwrote newer cloud version',null,'บันทึกทับเวอร์ชันของ '+((q._conflict&&q._conflict.serverBy)||'ผู้ใช้อื่น'));
  const res=await syncCloud(q,{force:true});
  if(res.ok){_editConflict=null;toast('บันทึกทับเวอร์ชันบน Cloud แล้ว','good');renderNav();render();}
}

function syncProduct(p){
  const _bp=BOIS[p.code]!=null?BOIS[p.code]:(p.boiPrice||'');
  postCloud({action:'saveProduct',code:p.code,desc:p.desc,group:p.group,comGroup:p.comGroup||'',uom:p.uom,warranty:p.warranty,
    duty:p.duty,supplier:p.supplier,lead:p.lead,defaultPrice:p.defaultPrice||'',defaultCur:p.defaultCur||'USD',boiPrice:_bp,by:CURRENT?CURRENT.name:'-'})
    .then(r=>setCloudDot(r.ok?'on':'err'));
}
async function pullProducts(){
  if(!cloudReady()){toast('ยังไม่ได้ตั้งค่า URL หรือยังไม่ได้เปิดผ่าน Apps Script','bad');return}
  toast('กำลังดึงข้อมูล...','');
  const d=await cloudGet('products');
  if(d&&d.products){
    const existing=new Set(allProducts().map(p=>p.code));let added=0,priced=0;
    d.products.forEach(p=>{
      if(p.code&&!existing.has(p.code)){CUSTOM.push(p);added++;}
      if(p.code&&p.comGroup)COMGROUPS[p.code]=p.comGroup;
      if(p.code&&p.defaultPrice!==''&&p.defaultPrice!=null){PRICES[p.code]={price:+p.defaultPrice,cur:p.defaultCur||'USD'};priced++;}
      if(p.code&&p.boiPrice!==''&&p.boiPrice!=null){BOIS[p.code]=+p.boiPrice;}
    });
    LS.set('customProducts',CUSTOM);LS.set('prices',PRICES);LS.set('comgroups',COMGROUPS);render();
    toast('ดึงสำเร็จ +'+added+' รายการ, ราคา '+priced+' รายการ','good');
  }else toast('ไม่พบข้อมูลสินค้า (ตรวจการ Deploy / เปิดผ่าน Apps Script)','bad');
}
/* ---- connection diagnostic: tells the user EXACTLY what's wrong ---- */
function setDiag(html,kind){const d=$('#cloudDiag');if(d)d.innerHTML='<span style="color:var(--'+(kind==='ok'?'green':kind==='bad'?'red':'muted')+')">'+html+'</span>';}
async function testCloud(){
  // Mode 1: served by Apps Script (best) — google.script.run available
  if(gsRun()){
    setCloudDot('sync');setDiag('กำลังทดสอบผ่าน Apps Script…');
    const r=await postCloud({action:'ping',by:CURRENT?CURRENT.name:'-'});
    if(r.ok){toast('✓ เชื่อมต่อผ่าน Apps Script สำเร็จ','good');setCloudDot('on');setDiag('✓ โหมด A: เชื่อมผ่าน Apps Script สำเร็จ — ข้อมูลซิงค์อัตโนมัติ','ok');await initializeData();}
    else{toast('Apps Script ตอบกลับผิดพลาด','bad');setCloudDot('err');setDiag('✗ Apps Script error: '+(r.error||'-')+' — ลอง Deploy เวอร์ชันใหม่','bad');}
    return;
  }
  // Mode 2: hosted elsewhere — needs URL + not file://
  if(location.protocol==='file:'){
    setCloudDot('err');

    toast('เปิดแบบ file:// เชื่อมต่อไม่ได้ — ดูคำแนะนำในหน้านี้','bad');

  }
  if(!SETTINGS.cloudUrl||!SETTINGS.cloudUrl.startsWith('http')){setDiag('✗ ยังไม่ได้ใส่ URL (.../exec)','bad');toast('ยังไม่ได้ใส่ URL','bad');return}
  if(!/\/exec\b/.test(SETTINGS.cloudUrl)){setDiag('✗ URL ควรลงท้ายด้วย <b>/exec</b> (ไม่ใช่ /dev)','bad');setCloudDot('err');toast('URL ควรลงท้าย /exec','bad');return}
  setCloudDot('sync');setDiag('กำลังทดสอบการเชื่อมต่อ…');
  const r=await postCloud({action:'ping',by:CURRENT?CURRENT.name:'-'});
  if(r.ok){toast('✓ เชื่อมต่อสำเร็จ','good');setCloudDot('on');setDiag('✓ โหมด B: เชื่อมต่อ /exec สำเร็จ — กำลังดึงข้อมูล','ok');await initializeData();}
  else{setCloudDot('err');
    setDiag('✗ เชื่อมต่อไม่สำเร็จ: '+(r.error||'-')+'<br>ตรวจ: Deploy “Who has access = <b>Anyone</b>” + กด Deploy เวอร์ชันใหม่ + URL ลงท้าย /exec','bad');
    toast('เชื่อมต่อไม่สำเร็จ — ดูรายละเอียดในหน้านี้','bad');}
}

/* ============================================================ FX AUDIT (C1/C2)
   ใบเก่าไม่ถูกแก้อัตโนมัติ — SR/QT คือหลักฐาน ห้ามเขียนทับเงียบ ๆ
   ฟังก์ชันนี้แค่ "ชี้เป้า" ว่าใบไหนมีสินค้าสกุลต่างประเทศและใช้เรตเท่าไร
   แล้ว Aon ตัดสินทีละใบเองว่าจะทำรอบใหม่หรือปล่อยไว้
   ============================================================ */
function fxAudit(){
  const rows=[];
  QUOTES.filter(q=>!q.deleted).forEach(q=>{
    const H=q.header||{};
    (q.lines||[]).forEach(L=>{
      const cur=L.costCur;
      if(!cur||cur===H.currency||cur==='THB')return;
      const used=getRate(H,cur);
      const should=(cur==='CNY')?(+SETTINGS.rateCNY||FX_FALLBACK.CNY):(cur==='USD'?(+SETTINGS.exrate||FX_FALLBACK.USD):used);
      const pinned=!!(H.rates&&H.rates[cur]>0);
      rows.push({q,cur,used,should,pinned,
        qty:+L.qty||0,up:+L.up||0,
        code:L.code||L.desc||'',
        diff:((+L.up||0)*(+L.qty||0))*(used-should)});
    });
  });
  return rows;
}
function viewFxAudit(){
  const all=fxAudit();
  const bad=all.filter(r=>Math.abs(r.used-r.should)>0.01);
  const byDoc={};
  bad.forEach(r=>{
    const k=r.q.id;
    if(!byDoc[k])byDoc[k]={q:r.q,lines:[],diff:0};
    byDoc[k].lines.push(r);byDoc[k].diff+=r.diff;
  });
  const docs=Object.values(byDoc).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  const total=docs.reduce((s,d)=>s+d.diff,0);
  modal(`<div class="modal-h"><h3>🔍 ตรวจเรตแลกเงินของใบเก่า</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <div class="hint" style="line-height:1.75;margin-bottom:12px">
      เทียบ "เรตที่ใบนั้นใช้จริง" กับ "เรตตั้งต้นปัจจุบัน" (USD ${+SETTINGS.exrate||FX_FALLBACK.USD} · CNY ${+SETTINGS.rateCNY||FX_FALLBACK.CNY})<br>
      พบบรรทัดสกุลต่างประเทศทั้งหมด <b>${all.length}</b> บรรทัด · เรตไม่ตรงเกณฑ์ปัจจุบัน <b>${bad.length}</b> บรรทัด ใน <b>${docs.length}</b> ใบ<br>
      <b style="color:var(--amber)">ระบบไม่แก้ใบเก่าให้อัตโนมัติ</b> — ใบที่ส่งลูกค้าไปแล้วคือหลักฐาน ถ้าจะแก้ให้กด “ทำรอบใหม่” ในใบนั้น</div>
    ${docs.length?`<div class="tw" style="border:1px solid var(--line);max-height:340px;overflow:auto"><table>
      <thead><tr><th>เอกสาร</th><th>ลูกค้า</th><th>สกุล</th><th class="r">เรตที่ใช้</th><th class="r">เรตปัจจุบัน</th><th class="r">ต้นทุนต่างกัน</th></tr></thead>
      <tbody>${docs.map(d=>{
        const curs=[...new Set(d.lines.map(x=>x.cur))].join(', ');
        const used=[...new Set(d.lines.map(x=>x.used))].join(', ');
        const should=[...new Set(d.lines.map(x=>x.should))].join(', ');
        return `<tr style="cursor:pointer" onclick="closeModal();openQuote('${d.q.id}')">
          <td class="mono" style="font-size:11px">${esc(d.q.docNo||d.q.header.ref||'—')}</td>
          <td style="font-size:12px">${esc(d.q.header.customer||'—')}</td>
          <td>${esc(curs)}</td>
          <td class="r mono">${esc(used)}</td><td class="r mono">${esc(should)}</td>
          <td class="r mono" style="color:${d.diff>0?'var(--red)':'var(--green)'}">${d.diff>0?'+':''}${fmt0(d.diff)}</td></tr>`;
      }).join('')}</tbody></table></div>
      <div class="hint" style="margin-top:10px">รวมส่วนต่างต้นทุนทั้งหมด <b style="color:${total>0?'var(--red)':'var(--green)'}">${total>0?'+':''}${fmt0(total)}</b> บาท
        · เครื่องหมายบวก = ใบนั้นคิดต้นทุนไว้สูงเกินจริง (เราเสนอราคาแพงเกินไป)</div>`
      :`<div class="empty">✅ ไม่พบใบที่ใช้เรตต่างจากเกณฑ์ปัจจุบัน</div>`}
  </div>
  <div class="modal-f"><button class="btn ghost" onclick="exportFxAuditCSV()">⤓ ส่งออก CSV</button>
    <button class="btn" onclick="closeModal()">ปิด</button></div>`,true);
}
function exportFxAuditCSV(){
  const rows=[['ตรวจเรตแลกเงิน · MGS',todayISO(),'เรตปัจจุบัน USD',+SETTINGS.exrate||FX_FALLBACK.USD,'CNY',+SETTINGS.rateCNY||FX_FALLBACK.CNY],[],
    ['เอกสาร','ลูกค้า','โครงการ','สินค้า','สกุล','จำนวน','ทุน/หน่วย','เรตที่ใบใช้','เรตปัจจุบัน','เรตถูกตรึงในใบ','ต้นทุนต่างกัน (฿)']];
  fxAudit().forEach(r=>rows.push([r.q.docNo||r.q.header.ref||'',r.q.header.customer||'',r.q.header.title||'',
    r.code,r.cur,r.qty,r.up,r.used,r.should,r.pinned?'ใช่':'ไม่',Math.round(r.diff)]));
  downloadCSV('fx_audit_'+todayISO()+'.csv',rows);
}
function runSelfTest(){
  const res=[];
  const near=(a,b,tol)=>Math.abs((+a||0)-(+b||0))<=(tol==null?0.01:tol);
  const t=(name,pass,detail)=>res.push({name:name,pass:!!pass,detail:detail||''});

  /* 1) หลายสกุลเงินในใบเดียว — USD + CNY + THB ต้องแปลงถูกทุกบรรทัด */
  try{
    const q=_stQuote();
    q.header.rates={USD:36,CNY:5};q.header.exrate=36;
    q.lines=[_stLine({costCur:'USD',up:100,qty:2}),_stLine({costCur:'CNY',up:100,qty:3}),_stLine({costCur:'THB',up:100,qty:4})];
    const c=computeQuote(q);
    const ok=near(c.lines[0].pricePC,3600)&&near(c.lines[1].pricePC,500)&&near(c.lines[2].pricePC,100);
    t('1. แปลงสกุลเงิน USD/CNY/THB',ok,`USD→${fmt(c.lines[0].pricePC)} (คาด 3,600) · CNY→${fmt(c.lines[1].pricePC)} (คาด 500) · THB→${fmt(c.lines[2].pricePC)} (คาด 100)`);
  }catch(e){t('1. แปลงสกุลเงิน USD/CNY/THB',false,String(e))}

  /* 2) Global Extra — total ต้อง = ผลรวมบรรทัด + extras เป๊ะ */
  try{
    const q=_stQuote();
    q.lines=[_stLine({up:1000,qty:3,opPct:20}),_stLine({up:250,qty:7,opPct:12.5})];
    q.globalExtras=[{label:'ค่าขนส่ง',amount:5000,cur:'THB'},{label:'ค่าติดตั้ง USD',amount:100,cur:'USD'}];
    const c=computeQuote(q);
    const sumLines=c.lines.reduce((a,o)=>a+o.lineTotal,0);
    const extras=5000+100*36;
    const ok=near(c.globalExtras,extras)&&near(c.total,sumLines+extras);
    t('2. ยอดรวม = ผลรวมบรรทัด + Global Extra',ok,`บรรทัด ${fmt(sumLines)} + extras ${fmt(c.globalExtras)} = ${fmt(sumLines+c.globalExtras)} · total=${fmt(c.total)}`);
  }catch(e){t('2. ยอดรวม = ผลรวมบรรทัด + Global Extra',false,String(e))}

  /* 3) aggregateQuotes([q]) ต้องตรงกับ computeQuote(q) ของใบเดียวกัน */
  try{
    const q=_stQuote();
    q.lines=[_stLine({up:800,qty:5,opPct:18,costCur:'USD'}),_stLine({up:1200,qty:2,opPct:25})];
    q.globalExtras=[{label:'freight',amount:3000,cur:'THB'}];
    const c=computeQuote(q), a=aggregateQuotes([q]);
    const ok=near(a.total,c.prodTotal,0.02)&&near(a.profit,c.profit,0.02)&&near(a.cost,c.cost,0.02);
    t('3. aggregateQuotes = computeQuote',ok,`agg: ยอด ${fmt(a.total)} / ต้นทุน ${fmt(a.cost)} / กำไร ${fmt(a.profit)} · compute: ยอดสินค้า ${fmt(c.prodTotal)} / ต้นทุน ${fmt(c.cost)} / กำไร ${fmt(c.profit)}`);
  }catch(e){t('3. aggregateQuotes = computeQuote',false,String(e))}

  /* 4) reverse calc — Total U/P = 100, ทุน = 80 → %GP = 20.000 */
  const _prevEditing=editing,_prevDirty=dirty;
  try{
    const q=_stQuote();
    q.header.incoterm='EXWORKS';                 // ไม่คิด clearance
    q.lines=[_stLine({up:80,costCur:'THB',qty:1,dutyPct:0,clearancePct:0,freep:0,opPct:0})];
    editing=q;
    totalEdit(0,100,null);
    const gp=editing.lines[0].opPct;
    const r=computeLine(editing.lines[0],editing.header);
    const ok=near(gp,20,0.0005)&&near(r.totalUP,100,0.01);
    t('4. คิดย้อนกลับ: ราคา 100 / ทุน 80 → %GP 20.000',ok,`ได้ %GP = ${gp} · ราคากลับมา = ${fmt(r.totalUP)}`);
  }catch(e){t('4. คิดย้อนกลับ: ราคา 100 / ทุน 80 → %GP 20.000',false,String(e))}
  finally{editing=_prevEditing;dirty=_prevDirty;}

  /* 5) migration ข้อมูลรูปแบบเก่า (ไม่มี _v / _pm) → ยอดรวมต้องไม่เปลี่ยน */
  try{
    const ex=36;
    const oldQ={id:'selftest_old',round:1,stage:'Draft',followStatus:'Pending',approvals:[],
      created:'2025-06-01',updated:'2025-06-01',
      header:{ref:'OLD-1',title:'old',customer:'old',sales:'',currency:'THB',priceTerm:'Special price',
        incoterm:'CIF at MGS',exrate:ex,offerDate:'2025-06-01',validity:30,reqDate:'2025-06-01',groupType:'Inverter'},
      lines:[
        {code:'A',desc:'a',group:'INVERTER',uom:'unit',qty:3,up:100,costCur:'USD',
         dutyPct:0.05,clearancePct:0.02,opPct:0.20,freep:50,extras:[{amount:10,cur:'USD'}]},
        {code:'B',desc:'b',group:'INVERTER',uom:'unit',qty:2,up:500,costCur:'THB',
         dutyPct:0,clearancePct:0.02,opPct:0.15,freep:0,extras:[]}
      ],remarks:[]};
    // ยอดรวมตามสูตรเดิม (v1: % เป็นทศนิยม, opPct = markup บน pricePC, extras คิดต่อชิ้น)
    let oldTotal=0;
    oldQ.lines.forEach(L=>{
      const rate=(L.costCur===oldQ.header.currency)?1:ex;
      const pricePC=L.up*rate;
      const duty=L.dutyPct*pricePC;
      const clr=L.clearancePct*pricePC;          // CIF → คิด clearance
      const op=L.opPct*pricePC;
      const unit=pricePC+duty+clr+(L.freep||0)+op;
      const exPer=(L.extras||[]).reduce((a,e)=>a+((e.cur===oldQ.header.currency)?1:ex)*(+e.amount||0),0);
      oldTotal+=unit*L.qty+exPer*L.qty;
    });
    const migrated=migrateQuote(JSON.parse(JSON.stringify(oldQ)));
    const newTotal=computeQuote(migrated).total;
    const ok=near(newTotal,oldTotal,1);          // เผื่อการปัดเศษ 2 ตำแหน่งของข้อ 3.5
    t('5. migration ข้อมูลเก่า — ยอดรวมไม่เปลี่ยน',ok,`เดิม ${fmt(oldTotal)} → หลัง migrate ${fmt(newTotal)} (ต่าง ${fmt(Math.abs(newTotal-oldTotal))})`);
  }catch(e){t('5. migration ข้อมูลเก่า — ยอดรวมไม่เปลี่ยน',false,String(e))}

  /* 6) 3.5 — ราคา/หน่วย × จำนวน ต้อง = ยอดรวมบรรทัด เป๊ะ (ไม่มีเศษหลุด) */
  try{
    const q=_stQuote();
    q.lines=[_stLine({up:333,qty:7,opPct:17.7}),_stLine({up:1234.56,qty:3,opPct:8.33,costCur:'USD'})];
    const c=computeQuote(q);
    const ok=c.lines.every(o=>near(o.totalUP*(+o.L.qty||0),o.lineTotal,0.005));
    t('6. ปัดเศษ: ราคา/หน่วย × จำนวน = ยอดบรรทัด',ok,
      c.lines.map(o=>`${fmt(o.totalUP)}×${o.L.qty}=${fmt(o.lineTotal)}`).join(' · '));
  }catch(e){t('6. ปัดเศษ: ราคา/หน่วย × จำนวน = ยอดบรรทัด',false,String(e))}

  const passed=res.filter(r=>r.pass).length;
  // console
  try{
    console.log('%c MGS Self-Test — '+passed+'/'+res.length+' ผ่าน ','background:'+(passed===res.length?'#2e8a5b':'#bb3b2f')+';color:#fff;font-weight:700');
    res.forEach(r=>console.log((r.pass?'✓ ':'✗ ')+r.name+(r.detail?'\n    '+r.detail:'')));
  }catch(e){}
  // modal (ถ้ามี UI)
  try{
    if(typeof modal==='function'&&document.getElementById('modalRoot')){
      modal(`<div class="modal-h"><h3>🧪 Self-Test สูตรคำนวณ — ${passed}/${res.length} ผ่าน</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
      <div class="modal-b"><div class="tw" style="border:1px solid var(--line)"><table><thead><tr><th style="width:34px"></th><th>รายการทดสอบ</th><th>ผลที่ได้</th></tr></thead>
      <tbody>${res.map(r=>`<tr><td style="text-align:center;font-size:15px">${r.pass?'✅':'❌'}</td>
        <td style="white-space:normal;font-weight:600;font-size:12.5px">${esc(r.name)}</td>
        <td style="white-space:normal;font-size:11.5px;color:var(--muted)" class="mono">${esc(r.detail)}</td></tr>`).join('')}</tbody></table></div>
      <div class="hint" style="margin-top:10px">ทดสอบบนข้อมูลจำลอง ไม่กระทบใบเสนอราคาจริง · เรียกซ้ำได้จาก console ด้วย <code>runSelfTest()</code></div></div>
      <div class="modal-f"><button class="btn" onclick="closeModal()">ปิด</button></div>`,true);
    }
  }catch(e){}
  return {passed:passed,total:res.length,results:res};
}

  if(q.docType==='SR')return salesStatusBadge(q.status||'Submitted');
  const st=q.status||QT_DEFAULT_STATUS;

  const next=allowedNextStatuses(q).filter(x=>x!==st);

  return `<select class="inp" style="padding:4px 8px;font-size:12px;width:auto" onchange="setStatus('${q.id}',this.value)">
    <option selected>${esc(st)}</option>${next.map(x=>`<option>${x}</option>`).join('')}</select>`;
}

let srEditId=null, _srEditPending=false;
function srEditable(q){
  if(!q||q.docType!=='SR'||q.deleted)return false;
  if(q.assignedTo)return false;                                   // มีคนรับงานแล้ว
  if(['Draft','Submitted'].indexOf(q.status||'Submitted')<0)return false;
  if((q.quoteIds||[]).length)return false;                        // มี QT ผูกแล้ว
  return (q.header&&q.header.salesUserId)===CURRENT.id||perms().approve;
}
function newSalesRequest(){srEditId=null;srLines=[];go('salesrequest')}
function editSalesRequest(id){
  const q=QUOTES.find(x=>x.id===id);

  if(!srEditable(q)){toast('คำขอนี้ถูกรับงานแล้ว แก้ไขไม่ได้','bad');return}
  srEditId=id;
  srLines=(q.lines||[]).map(L=>({code:L.code||'',desc:L.desc||'',qty:L.qty||1,uom:L.uom||'pcs',

function srSuggest(i,val){
  let dd=document.getElementById('_srDD');
  if(!dd){dd=document.createElement('div');dd.id='_srDD';
    dd.style.cssText='position:fixed;z-index:9999;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-height:260px;overflow-y:auto;display:none';
    document.body.appendChild(dd);}

  const all=allProducts();
  _srSugMatches=all.filter(p=>p.code.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)).slice(0,12);

function submitSalesRequest(){
  const cust=($('#srCust').value||'').trim();
  const title=($('#srTitle').value||'').trim();
  const group=$('#srGroup').value;
  const currency=$('#srCurrency').value;
  const priceTerm=$('#srPriceTerm').value;
  const incoterm=$('#srIncoterm').value;
  const validity=parseInt($('#srValidity').value)||30;
  const spec=($('#srSpec').value||'').trim();
  const needBy=$('#srNeedBy').value;
  if(!cust){toast('กรุณาใส่ชื่อลูกค้า','bad');return;}
  if(srLines.length===0){toast('กรุณาเพิ่มรายการสินค้าอย่างน้อย 1 รายการ','bad');return;}
  const emptyDesc=srLines.some(L=>!(L.desc||'').trim());
  if(emptyDesc){toast('กรุณาใส่ชื่อสินค้าให้ครบทุกรายการ','bad');return;}
  const lines=srLines.map(L=>({
    code:'',desc:(L.desc||'').trim(),group:group,comGroup:'',
    uom:L.uom||'pcs',qty:parseFloat(L.qty)||1,
    up:0,costCur:currency,dutyPct:0,clearancePct:0,opPct:0,freep:0,extras:[],
    targetUp:parseFloat(L.targetUp)||0,salesNote:(L.note||'').trim()
  }));
  /* 3: โหมดแก้ไข — อัปเดตใบเดิม ไม่สร้างเลขใหม่ */
  if(srEditId){
    const old=QUOTES.find(x=>x.id===srEditId);
    if(!old){toast('ไม่พบคำขอเดิม','bad');srEditId=null;return}
    if(!srEditable(old)){toast('คำขอนี้ถูก Sourcing รับงานไปแล้ว แก้ไขไม่ได้','bad');srEditId=null;go('salesdash');return}
    const before=`${old.header.customer||''} · ${(old.lines||[]).length} รายการ`;
    Object.assign(old.header,{customer:cust,title:title||cust,groupType:group,needBy:needBy||'',
      currency:currency,priceTerm:priceTerm,incoterm:incoterm,validity:validity});
    old.lines=lines;old.salesNote=spec;
    old.updated=todayISO();old.updatedAt=new Date().toISOString();old.rev=(old.rev||1)+1;old.isSynced=false;
    logAction(old.id,'Edited request',null,before+' → '+cust+' · '+lines.length+' รายการ');
    LS.set('quotes',QUOTES);syncCloud(old);
    toast('อัปเดตคำขอ '+(old.docNo||old.header.ref||'')+' แล้ว','good');
    srEditId=null;srLines=[];go('salesdash');return;
  }
  const docNo=genDocNo('SR');
  const q={
    id:uid(),_v:2,docType:'SR',docNo,status:'Submitted',quoteIds:[],assignedTo:null,
    createdBy:CURRENT.id,createdByName:CURRENT.name,
    created:todayISO(),updated:todayISO(),updatedAt:new Date().toISOString(),rev:1,
    stage:'Draft',followStatus:'Requested',round:1,
    salesNote:spec,approvals:[],parentId:null,releasedTo:[],auditLogs:[],
    header:{
      ref:docNo,customer:cust,title:title||cust,
      sales:CURRENT.name,salesUserId:CURRENT.id,groupType:group,
      reqDate:todayISO(),needBy:needBy||'',
      currency:currency,priceTerm:priceTerm,
      incoterm:incoterm,exrate:SETTINGS.exrate,
      rates:{USD:SETTINGS.exrate,CNY:+SETTINGS.rateCNY||FX_FALLBACK.CNY},
      offerDate:todayISO(),validity:validity,
    },
    lines:lines,remarks:[]
  };
  QUOTES.unshift(q);
  LS.set('quotes',QUOTES);
  syncCloud(q);
  logAuditStatus(q,'status','—','Submitted');
  toast('ส่งคำขอ '+docNo+' ให้ Sourcing แล้ว!','good');
  srLines=[];go('salesdash');
}
function deleteSalesRequest(id){
  const q=QUOTES.find(x=>x.id===id);if(!q)return;
  if(!srEditable(q)){toast('คำขอนี้ถูก Sourcing รับงานไปแล้ว ลบไม่ได้','bad');return}
  const nm=q.header.title||q.header.ref||'คำขอนี้';
  confirmModal('ลบคำขอราคา?','ต้องการลบ <b>"'+esc(nm)+'"</b> ('+esc(q.docNo||q.header.ref||'')+') หรือไม่?<br><span class="hint">ลบได้เพราะยังไม่มีใครรับงาน</span>',()=>{
    const tgt=QUOTES.find(x=>x.id===id);
    if(tgt&&srEditable(tgt)){
      tgt.deleted=true;tgt.deletedAt=new Date().toISOString();tgt.deletedBy=CURRENT?CURRENT.name:'-';tgt.isSynced=false;
      logAction(tgt.id,'Deleted request',null,nm);
      LS.set('quotes',QUOTES);syncDelete(id);
      closeModal();srEditId=null;srLines=[];toast('ลบคำขอแล้ว','good');go('salesdash');
    } else {closeModal();toast('คำขอนี้ถูกรับงานไปแล้ว ลบไม่ได้','bad');}
  },'ยืนยันลบคำขอ');
}

// 2.6: one click = assign to me + move SR forward + open the costing screen pre-filled with the Sales lines
function takeSRAndCost(id){
  const sr=QUOTES.find(x=>x.id===id);
  if(!sr||sr.docType!=='SR'){toast('ไม่พบคำขอราคา','bad');return}
  if(!perms().create){toast('เฉพาะ Sourcing / Manager เท่านั้นที่รับงานได้','bad');return}
  const old=sr.status||'Submitted';
  sr.assignedTo=CURRENT.id;
  if(old==='Submitted')updateStatus(sr,'Accepted');
  sr.isSynced=false;
  logAction(sr.id,'Accepted SR',null,'ผู้รับผิดชอบ: '+CURRENT.name);
  LS.set('quotes',QUOTES);syncCloud(sr);
  createQTFromSR(id);
}
function acceptSR(id){
  const q=QUOTES.find(x=>x.id===id);if(!q||q.docType!=='SR')return;
  updateStatus(q,'Accepted');
  q.assignedTo=CURRENT.id;q.isSynced=false;
  LS.set('quotes',QUOTES);
  logAuditStatus(q,'status','Submitted','Accepted');
  syncCloud(q);
  toast('รับงาน SR '+q.docNo+' แล้ว — สร้าง QT ได้เลย','good');
  render();
}

    createdBy:CURRENT.id,createdByName:CURRENT.name,
    created:todayISO(),updated:todayISO(),updatedAt:new Date().toISOString(),rev:1,
    stage:'Draft',followStatus:'Pending',round:1,parentId:null,approvals:[],
    releasedTo:[],needsApproval:false,assignedTo:CURRENT.id,
    header:{
      ref:genRef(REF_PREFIX[gt]||'IN'),
      title:sr.header.title||sr.header.customer||'',
      customer:sr.header.customer||'',
      sales:sr.header.sales||'',
      salesUserId:sr.header.salesUserId||null,
      project:sr.header.project||'',
      groupType:gt,
      currency:sr.header.currency||'THB',
      priceTerm:sr.header.priceTerm||SETTINGS.priceTerms[0],
      incoterm:sr.header.incoterm||SETTINGS.incoterms[0],
      exrate:SETTINGS.exrate,
      rates:{USD:SETTINGS.exrate,CNY:+SETTINGS.rateCNY||FX_FALLBACK.CNY},
      offerDate:todayISO(),validity:sr.header.validity||30,
      reqDate:sr.header.reqDate||todayISO(),
      needBy:sr.header.needBy||'',
    },
    lines:sr.lines.map(L=>Object.assign({},L,{up:0,opPct:0})),
    remarks:['Price valid 30 days','Lead time = ','Delivery : '],
    salesNote:sr.salesNote||'',
    auditLogs:[],
  };
  // Mark SR as Quoted once first QT is created
  if(sr.status==='Accepted'){updateStatus(sr,'Quoted');}
  if(!Array.isArray(sr.quoteIds))sr.quoteIds=[];
  sr.quoteIds.push(qt.id);
  sr.updated=todayISO();sr.updatedAt=new Date().toISOString();
  QUOTES.unshift(qt);
  LS.set('quotes',QUOTES);
  syncCloud(qt);syncCloud(sr);
  logAuditStatus(qt,'status','—',QT_DEFAULT_STATUS);
  toast('สร้าง QT '+docNo+' จาก SR '+sr.docNo+' แล้ว — เปิดทำราคา','good');
  editing=JSON.parse(JSON.stringify(qt));
  go('new');
}

initLogin();
const sess=LS.get('session');
window.__booted=true;   // boot guard: สคริปต์หลักโหลดครบแล้ว
if(sess){const u=USERS.find(x=>x.id===sess);if(u){CURRENT=u;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');mountApp()}}
</script>
