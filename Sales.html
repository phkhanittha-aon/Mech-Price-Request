<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MGS Sales — ขอราคา &amp; ติดตามงานขาย</title>
<style>
:root{
  --ink:#1c1610; --ink-2:#4a4138; --muted:#8a7d6c;
  --paper:#faf6ef; --surface:#ffffff; --surface-2:#f5efe5;
  --line:#ebe2d4; --line-2:#ddd1bf;
  --orange:#e8740c; --orange-deep:#c25803; --orange-soft:#fdeede;
  --green:#2e8a5b; --green-soft:#e4f3ea;
  --amber:#c98a12; --amber-soft:#fbf1da;
  --blue:#2f6bb0; --blue-soft:#e7f0fa;
  --red:#bb3b2f; --red-soft:#fae8e5;
  --grey:#8a7d6c; --grey-soft:#efe9df;
  --shadow:0 1px 2px rgba(40,28,12,.05),0 8px 28px rgba(40,28,12,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Inter','Sarabun',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--orange-deep);text-decoration:none}
.hidden{display:none!important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.hint{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:11px;background:var(--orange);color:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--orange-deep)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.red{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.inp:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.req::after{content:' *';color:var(--red)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green)}.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.red{background:var(--red-soft);color:var(--red)}
.tag.grey{background:var(--grey-soft);color:var(--grey)}.tag.orange{background:var(--orange-soft);color:var(--orange-deep)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15px}
.card-b{padding:16px 18px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff7ec,#f4ece0)}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(40,28,12,.14);overflow:hidden}
.login-top{height:6px;background:linear-gradient(90deg,var(--orange),#f2b33d)}
.login-body{padding:28px 26px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-logo img{height:44px}
.login-logo b{display:block;font-size:16px}.login-logo span{font-size:12px;color:var(--muted)}
.login-body h1{font-size:20px;margin-bottom:4px}
.field{margin-bottom:14px}
.login-err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px;line-height:1.5}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border:1px solid var(--line-2);border-radius:11px;background:#fff;font-weight:600}
.gbtn:hover{background:var(--surface-2)}
/* app shell */
.top{position:sticky;top:0;z-index:30;background:rgba(250,246,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{height:32px}.brand b{font-size:14px;display:block;line-height:1.1}.brand span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:10px}
.tab{padding:8px 13px;border-radius:10px;font-weight:600;color:var(--ink-2);font-size:13.5px;display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--orange-soft);color:var(--orange-deep)}
.me{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:12px}
.me:hover{background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#f2b33d);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.avatar.lg{width:52px;height:52px;flex:0 0 52px;font-size:21px}
.me .nm{font-weight:600;font-size:13px;line-height:1.15}.me .rl{font-size:11px;color:var(--muted)}
.live{font-size:11px;color:var(--green);font-weight:600;white-space:nowrap}
.live.off{color:var(--muted);font-weight:500}
main{max-width:1180px;margin:0 auto;padding:18px 16px 96px}
.bottom-nav{display:none}
@media(max-width:760px){
  .tabs,.me .txt,.live{display:none}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px}
  .bottom-nav button .ic{font-size:19px;line-height:1}
  .bottom-nav button.on{color:var(--orange-deep);background:var(--orange-soft)}
}
/* person header + kpis */
.person{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.person h1{font-size:20px;line-height:1.2}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:box-shadow .12s}
.kpi:hover{box-shadow:var(--shadow)}
.kpi.on{border-color:var(--orange);box-shadow:inset 0 -3px 0 var(--orange)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;line-height:1.2}
.kpi .s{font-size:11px;color:var(--muted)}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:first-child{grid-column:span 2}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;max-width:380px}
/* job cards */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.job.alert{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.job.late{box-shadow:inset 3px 0 0 var(--amber)}
.job.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--orange)}100%{box-shadow:0 0 0 0 transparent}}
.job-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.job-t{font-weight:700;font-size:14px;line-height:1.3}
.job-c{font-size:12.5px;color:var(--ink-2)}
.job-no{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap}
.job-mid{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.job-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px}
.job-meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.job-acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:9px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:6px}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.tcard:hover{box-shadow:var(--shadow)}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tstats div{background:var(--surface-2);border-radius:9px;padding:6px 2px}
.tstats b{display:block;font-size:17px}.tstats span{font-size:10.5px;color:var(--muted)}
/* request form */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fgrid .s2{grid-column:span 2}.fgrid .s4{grid-column:1/-1}
@media(max-width:760px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .s2,.fgrid .s4{grid-column:1/-1}}
.lines{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:28px 2.2fr 3fr .8fr .9fr 1.1fr 1.6fr 34px;gap:8px;align-items:end;background:var(--surface-2);border-radius:12px;padding:10px}
.lrow .no{font-weight:700;color:var(--muted);text-align:center;padding-bottom:10px}
.lrow label{font-size:10.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.lrow .inp{padding:8px 9px;font-size:13px}
.lrow .del{height:38px;border-radius:9px;color:var(--red);background:var(--red-soft)}
@media(max-width:900px){.lrow{grid-template-columns:1fr 1fr}.lrow .no{grid-column:1/-1;text-align:left;padding:0}.lrow .c2{grid-column:1/-1}.lrow .del{grid-column:1/-1}}
.formbar{position:sticky;bottom:0;z-index:20;margin-top:16px;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;background:rgba(250,246,239,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 0}
@media(max-width:760px){.formbar{bottom:62px;gap:6px}.formbar #draftHint{display:none}.formbar .btn{padding:9px 11px;font-size:13px}}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(28,22,16,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;gap:8px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.x:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;z-index:80;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{background:var(--green)}.toast.bad{background:var(--red)}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:7px 8px;background:var(--surface-2)}
table.pt td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
table.pt .r{text-align:right}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.banner{border-radius:12px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.banner.blue{background:var(--blue-soft);border:1px solid rgba(47,107,176,.3)}
.banner.amber{background:var(--amber-soft);border:1px solid rgba(201,138,18,.35)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--orange);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<script>
/* ============================================================ BOOT GUARD (v4.2.1)
   ถ้าสคริปต์หลักพัง / ไฟล์ถูกวางไม่ครบ / เบราว์เซอร์บล็อก — แสดงสาเหตุบนจอแทน "หน้าว่าง"
   สคริปต์หลักต้องตั้ง window.__booted=true เมื่อเริ่มทำงานสำเร็จ */
(function(){
  var shown=false;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function show(msg){
    if(shown)return;shown=true;
    var d=document.createElement('div');d.id='bootErr';
    d.setAttribute('style','position:fixed;inset:0;z-index:99999;background:#fff;color:#1c1610;font:14px/1.75 system-ui,sans-serif;padding:24px;overflow:auto');
    d.innerHTML='<div style="max-width:640px;margin:0 auto">'+
      '<h2 style="color:#bb3b2f;font-size:20px;margin:0 0 8px">⚠️ หน้าเว็บโหลดไม่สำเร็จ</h2>'+
      '<div>สาเหตุที่ระบบตรวจพบ:</div><pre style="white-space:pre-wrap;background:#fae8e5;padding:10px 12px;border-radius:8px;font-size:12.5px">'+esc(msg)+'</pre>'+
      '<ol style="padding-left:20px;margin:10px 0">'+
      '<li>ถ้าข้อความบอกว่า <b>SyntaxError / Unexpected end</b> หรือ <b>สคริปต์ไม่ทำงานจนจบ</b> = ไฟล์ HTML ใน Apps Script ถูกวางไม่ครบ → ลบเนื้อหาไฟล์ทิ้งแล้ววางใหม่ทั้งไฟล์ กด 💾 Save → Deploy เวอร์ชันใหม่</li>'+
      '<li>เปิดลิงก์ <code>…/exec?diag=1</code> เพื่อตรวจว่าไฟล์บน Apps Script ครบหรือไม่</li>'+
      '<li>ลองกดปุ่มด้านล่างเพื่อล้างข้อมูลเก่าในเครื่อง แล้วกด F5</li></ol>'+
      '<button id="bootReset" style="padding:9px 14px;border:0;border-radius:9px;background:#e8740c;color:#fff;font-weight:600;cursor:pointer">ล้างข้อมูลในเครื่อง</button> '+
      '<span style="font-size:12px;color:#8a7d6c">('+esc(document.title)+')</span></div>';
    (document.body||document.documentElement).appendChild(d);
    var b=document.getElementById('bootReset');
    if(b)b.onclick=function(){try{localStorage.clear()}catch(e){}b.textContent='ล้างแล้ว — กด F5 เพื่อโหลดใหม่';};
  }
  window.__bootFail=show;
  window.addEventListener('error',function(e){
    if(window.__booted)return;
    show((e&&e.message||'Script error')+(e&&e.filename?'\n@ '+String(e.filename).split('/').pop()+' บรรทัด '+e.lineno:''));
  });
  window.addEventListener('load',function(){
    setTimeout(function(){if(!window.__booted)show('สคริปต์หลักไม่ทำงานจนจบ (มักเกิดจากไฟล์ HTML ถูกวางไม่ครบ / ถูกตัดท้าย)');},4000);
  });
})();
</script>


<div id="login">
  <div class="login-card"><div class="login-top"></div>
    <div class="login-body">
      <div class="login-logo"><img id="loginLogo" alt=""><div><b>M Global Sourcing</b><span>Sales · ขอราคา &amp; ติดตามงาน</span></div></div>
      <h1>เข้าสู่ระบบ</h1>
      <div class="hint" style="margin-bottom:18px">ใช้อีเมลบริษัทที่ลงทะเบียนไว้กับผู้ดูแลระบบ</div>
      <div id="ssoBox" class="hidden">
        <button class="gbtn" onclick="ssoLogin(false)"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>เข้าสู่ระบบด้วยบัญชี Google</button>
        <div class="or">หรือใช้อีเมล + รหัสผ่าน</div>
      </div>
      <div class="field"><label class="lbl">อีเมล (หรือ Username)</label>
        <input class="inp" id="loginUser" type="email" inputmode="email" placeholder="name@mglobalsourcing.com" autocomplete="username" autocapitalize="off"></div>

      <button class="btn full" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ →</button>
      <div class="login-err" id="loginErr"></div>
      <div class="hint" style="margin-top:12px;line-height:1.7">ยังไม่มีบัญชี / ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบ
        <div class="mono" style="font-size:10.5px;opacity:.7" id="buildStamp"></div></div>
    </div></div>
</div>

<div id="app" class="hidden">
  <header class="top"><div class="top-in">
    <div class="brand"><img id="topLogo" alt=""><div><b>MGS Sales</b><span>ขอราคา &amp; ติดตามงาน</span></div></div>
    <nav class="tabs" id="tabs"></nav>

  <nav class="bottom-nav" id="bnav"></nav>

<script>
/* ============================================================
   MGS SALES APP (build 4.2) — ใช้คู่กับ Code.gs v4.2
   - ล็อกอินด้วยอีเมล (คอลัมน์ Email ในแท็บ Users) หรือ Google Sign-in
   - สิทธิ์มาจาก server เท่านั้น (role ในแท็บ Users):
       Sales          → เห็น/ขอราคาเฉพาะงานของตัวเอง
       Sales Manager  → เห็นหน้า Sales ทุกคน (ไม่มีต้นทุน)
       Sourcing / Manager (GM, Admin, Procurement Mgr, BD Mgr) → เห็นทุกคน + ขอราคาแทน Sales ได้
   - แอปนี้ไม่เคยได้รับต้นทุน / %GP รายบรรทัด (server ส่งเฉพาะ SalesDetail)

const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0=n=>fmt(n,0);
/* v4.3: ทุกยอดเงินแสดงสกุลเงินของใบ (เดิมแสดง ฿ ทุกใบ แม้ใบเสนอเป็น USD) · ยอดรวมข้ามใบใช้ valueTHB จาก server */
const CUR_SYM={THB:'฿',USD:'US$',CNY:'CN¥'};
const money=(n,cur,dec)=>{const v=fmt(n,dec==null?0:dec);return v==='—'?v:(CUR_SYM[cur||'THB']||((cur||'')+' '))+v};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LS={get:(k,d)=>{try{const v=localStorage.getItem('mgs_sales_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem('mgs_sales_'+k,JSON.stringify(v))}catch(e){}},
  del:k=>{try{localStorage.removeItem('mgs_sales_'+k)}catch(e){}}};
async function hashPass(plain){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode((plain||'')+HASH_SALT));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const S={token:'',user:null,users:[],rows:{},settings:{},products:[],serverTime:'',
  route:{page:'me',id:''},filter:'all',search:'',polling:false,pollTimer:null,flash:{},form:null};
const caps=()=>(S.user&&S.user.caps)||{};

/* ============================================================ API (google.script.run เมื่อเปิดผ่าน /exec · fetch เมื่อโฮสต์ที่อื่น) */
function gsRun(){return !!(window.google&&google.script&&google.script.run)}
function withTimeout(p){return new Promise(res=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;res({ok:false,error:'timeout'})}},TIMEOUT_MS);
  p.then(r=>{if(!done){done=true;clearTimeout(t);res(r)}},e=>{if(!done){done=true;clearTimeout(t);res({ok:false,error:String(e&&e.message||e)})}})})}
function parse(r){try{return (typeof r==='string')?JSON.parse(r):(r||{ok:false,error:'empty'})}catch(e){return {ok:false,error:'bad response'}}}
async function api(payload){
  payload=Object.assign({},payload);if(S.token&&!payload.token)payload.token=S.token;
  const r=await withTimeout(new Promise(async res=>{
    if(gsRun()){google.script.run.withSuccessHandler(x=>res(parse(x))).withFailureHandler(e=>res({ok:false,error:String(e&&e.message||e)})).apiPost(JSON.stringify(payload));return}
    try{const x=await fetch(CLOUD_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});res(parse(await x.text()))}
    catch(e){res({ok:false,error:'network'})}
  }));
  if(r&&r.error==='AUTH_REQUIRED'&&payload.action!=='login'&&payload.action!=='ssoLogin')sessionExpired();
  return r;
}
async function apiGet(type,arg){
  const r=await withTimeout(new Promise(async res=>{
    if(gsRun()){google.script.run.withSuccessHandler(x=>res(parse(x))).withFailureHandler(e=>res({ok:false,error:String(e&&e.message||e)})).apiGet(type,S.token,arg==null?'':String(arg));return}
    const q='?type='+encodeURIComponent(type)+'&token='+encodeURIComponent(S.token)+(arg?((type==='quote'?'&id=':'&since=')+encodeURIComponent(arg)):'');
    try{const x=await fetch(CLOUD_URL+q,{redirect:'follow'});res(parse(await x.text()))}catch(e){res({ok:false,error:'network'})}
  }));
  if(r&&r.error==='AUTH_REQUIRED')sessionExpired();
  return r;
}

const LOGIN_ERR={AUTH_FAILED:'อีเมลหรือรหัสผ่านไม่ถูกต้อง',ACCOUNT_DISABLED:'บัญชีนี้ถูกปิดใช้งาน — ติดต่อผู้ดูแลระบบ',
  ACCOUNT_LOCKED:'กรอกรหัสผิดหลายครั้ง บัญชีถูกล็อกชั่วคราว 15 นาที — หรือให้ผู้ดูแลระบบตั้งรหัสใหม่',
  SSO_UNAVAILABLE:'ระบบมองไม่เห็นอีเมล Google ของคุณ (มักเกิดกับ Gmail ส่วนตัว) — กรุณาใช้อีเมล + รหัสผ่าน',
  timeout:'เชื่อมต่อเซิร์ฟเวอร์ไม่ทันเวลา — ลองใหม่อีกครั้ง',network:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ต'};
async function doLogin(){
  const user=($('#loginUser').value||'').trim(),pass=$('#loginPass').value;
  if(!user||!pass){$('#loginErr').textContent='กรุณากรอกอีเมลและรหัสผ่าน';return}
  const b=$('#loginBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> กำลังตรวจสอบ…';
  const r=await api({action:'login',user,passHash:await hashPass(pass),agent:'sales-app '+(navigator.userAgent||'').slice(0,80)});
  b.disabled=false;b.textContent='เข้าสู่ระบบ →';
  if(!r.ok){$('#loginErr').textContent=(LOGIN_ERR[r.error]||('เข้าสู่ระบบไม่สำเร็จ ('+(r.error||'-')+')'))+
    (r.error==='AUTH_FAILED'&&r.left!=null&&r.left<=2?' (เหลืออีก '+r.left+' ครั้งก่อนถูกล็อก)':'');return}
  LS.set('lastUser',user);$('#loginPass').value='';
  if(pass==='1234')setTimeout(()=>openChangePassword(true),900);   // BUSINESS RULE: รหัสตั้งต้นต้องเปลี่ยน
  startSession(r);
}
async function ssoLogin(silent){
  if(!gsRun()){if(!silent)$('#loginErr').textContent='Google Sign-in ใช้ได้เมื่อเปิดผ่านลิงก์ของระบบ (/exec) เท่านั้น';return false}
  if(!silent)$('#loginErr').innerHTML='<span class="spin"></span> กำลังตรวจสอบบัญชี Google…';
  const r=await api({action:'ssoLogin',agent:'sales-app google'});
  if(r.ok){startSession(r);return true}
  if(!silent)$('#loginErr').textContent=r.error==='SSO_NO_USER'
    ?('อีเมล '+(r.email||'')+' ยังไม่ได้ลงทะเบียนในระบบ — แจ้งผู้ดูแลให้เพิ่มอีเมลนี้ในแท็บ Users')
    :(LOGIN_ERR[r.error]||('Google Sign-in ไม่สำเร็จ ('+(r.error||'-')+')'));
  else $('#loginErr').textContent='';
  return false;
}
function startSession(r){
  S.token=r.token;S.user=r.user;LS.set('token',S.token);LS.set('user',S.user);
  $('#loginErr').textContent='';boot();
}
let _expiredShown=false;
function sessionExpired(){
  if(_expiredShown||!S.token)return;_expiredShown=true;
  stopPoll();S.token='';LS.del('token');
  modal(`<div class="modal-h"><h3>⏱ เซสชันหมดอายุ</h3></div>
    <div class="modal-b" style="line-height:1.8">กรุณาเข้าสู่ระบบอีกครั้ง — ร่างคำขอราคาที่ยังไม่ได้ส่งถูกเก็บไว้ในเครื่องนี้</div>
    <div class="modal-f"><button class="btn" onclick="closeModal();showLogin()">เข้าสู่ระบบ</button></div>`);
}
function logout(){
  if(S.token)api({action:'logout'});
  stopPoll();S.token='';S.user=null;S.rows={};LS.del('token');LS.del('user');closeModal();showLogin();
}
function showLogin(){
  _expiredShown=false;
  $('#app').classList.add('hidden');$('#login').classList.remove('hidden');
  const last=LS.get('lastUser','');if(last&&!$('#loginUser').value)$('#loginUser').value=last;
  $('#ssoBox').classList.toggle('hidden',!gsRun());
}

/* ============================================================ BOOT / DATA */
async function boot(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  const u=S.user;
  $('#meAv').textContent=(u.name||'?')[0].toUpperCase();$('#meName').textContent=u.name;$('#meRole').textContent=ROLE_TH[u.role]||u.role;
  $('#main').innerHTML='<div class="empty"><div class="spin"></div><div style="margin-top:10px">กำลังโหลดงาน…</div></div>';
  const [us,st,pr]=await Promise.all([apiGet('users'),apiGet('settings'),apiGet('products')]);
  S.users=(us&&us.users)||[];S.settings=(st&&st.ok)?st:{};
  S.products=buildProducts((pr&&pr.products)||[]);
  await loadAll();
  readRoute(()=>{render();startPoll()});
}
function buildProducts(sheetItems){
  const m={};
  CATALOG_LITE.forEach(p=>{m[p[0]]={code:p[0],desc:p[1],group:p[2],uom:p[3]}});
  sheetItems.forEach(p=>{if(p&&p.code)m[p.code]={code:String(p.code),desc:p.desc||'',group:p.group||'',uom:p.uom||''}});
  return Object.values(m);
}
function addRow(row){
  let d=null;try{d=row.salesDetail?JSON.parse(row.salesDetail):null}catch(e){d=null}
  row.d=d;S.rows[row.id]=row;
}
async function loadAll(){
  const d=await apiGet('salesview');
  if(!d||!d.ok){toast('โหลดข้อมูลไม่สำเร็จ: '+((d&&d.error)||'-'),'bad');return false}
  S.rows={};(d.quotations||[]).forEach(addRow);S.serverTime=d.serverTime||'';setLive();
  return true;
}
/* Live: ดึงเฉพาะงานที่เปลี่ยนทุก 30 วินาที — เห็นสถานะใหม่ (เช่น ปล่อยราคาแล้ว) โดยไม่ต้องรีเฟรช */
async function poll(force){
  if(S.polling||!S.token||(document.hidden&&!force))return;
  S.polling=true;
  try{
    const since=S.serverTime?new Date(Date.parse(S.serverTime)-OVERLAP_MS).toISOString():'';
    const d=since?await apiGet('salesview',since):null;
    if(!d){if(!since)await loadAll();return}
    if(!d.ok)return;
    const moved=[];let changed=0;
    (d.quotations||[]).forEach(row=>{
      const old=S.rows[row.id];
      if(old&&old.updatedAt===row.updatedAt)return;
      if(old&&old.status!==row.status)moved.push(row);
      addRow(row);S.flash[row.id]=Date.now();changed++;
    });
    S.serverTime=d.serverTime||S.serverTime;setLive();
    if(changed){
      if(moved.length===1)toast('🔔 '+(moved[0].docNo||'')+' : '+stageOf(S.rows[moved[0].id]).label,'good');
      else if(moved.length>1)toast('🔔 สถานะงานเปลี่ยน '+moved.length+' รายการ','good');
      if(!$('#modalRoot').innerHTML&&S.route.page!=='request')render();
    }
  }finally{S.polling=false}
}
function startPoll(){stopPoll();S.pollTimer=setInterval(poll,POLL_MS)}
function stopPoll(){if(S.pollTimer){clearInterval(S.pollTimer);S.pollTimer=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token)poll(true)});
function setLive(){const el=$('#live');if(!el)return;const t=new Date();el.className='live';
  el.textContent='● Live · '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  el.title='อัปเดตอัตโนมัติทุก '+(POLL_MS/1000)+' วินาที';}

/* ============================================================ DOMAIN HELPERS */
const isSR=r=>String(r.docType||'QT')==='SR';
const hdr=r=>(r.d&&r.d.header)||{};
const titleOf=r=>hdr(r).title||r.title||hdr(r).customer||r.customer||'(ไม่มีชื่อโครงการ)';
const custOf=r=>hdr(r).customer||r.customer||'';
const ownerOf=r=>String(r.salesUserId||hdr(r).salesUserId||'');
const userName=id=>{const u=S.users.find(x=>x.id===id);return u?u.name:''};
const daysSince=iso=>{const t=Date.parse(iso||'');return isNaN(t)?null:Math.floor((Date.now()-t)/86400000)};
const agoTH=iso=>{const d=daysSince(iso);return d===null?'—':d<=0?'วันนี้':d===1?'เมื่อวาน':d+' วันที่แล้ว'};
function priceShown(r){return !isSR(r)&&!r.priceLocked&&r.d&&Array.isArray(r.d.lines)&&r.d.lines.some(l=>l.unitPrice!=null)}
function curOf(r){return (r.d&&r.d.header&&r.d.header.currency)||r.currency||'THB'}
function valueOf(r){return priceShown(r)?(+r.d.total||+r.salesValue||0):0}
function valueTHB(r){return priceShown(r)&&r.valueTHB!=null?+r.valueTHB:(curOf(r)==='THB'?valueOf(r):0)}
/* ผู้รับผิดชอบ + SLA มาจาก server (row.follow) — ฟังก์ชันเดียวกับระบบทำราคา ห้ามคำนวณเองซ้ำ
   ใช้ fallbackFollow เฉพาะกรณีต่อกับ Code.gs รุ่นเก่าที่ยังไม่ส่ง follow มา */
function fallbackFollow(r){
  const st=String(r.status||'');let owner;
  if(isSR(r))owner=st==='Draft'?'SALES':(st==='Submitted'||st==='Accepted')?'SOURCING':'DONE';
  else if(st==='Requested'||st==='In Progress')owner='SOURCING';
  else if(st==='Submitted'||st==='Partial Approved')owner='MANAGEMENT';
  else if(st==='Approved')owner='RELEASER';
  else if(st==='Pending')owner=priceShown(r)?'SALES':'RELEASER';
  else owner='DONE';
  return {owner,label:{SOURCING:'รอ Sourcing จัดทำราคา',MANAGEMENT:'รอผู้จัดการอนุมัติ',RELEASER:'รอปล่อยราคา',SALES:'พร้อมเสนอลูกค้า',DONE:'ปิดงานแล้ว'}[owner],actionable:false,waitingDays:null,level:'ok'};
}
const fol=r=>r.follow||fallbackFollow(r);
const OWNER_SHORT={SOURCING:'Sourcing',MANAGEMENT:'ผู้จัดการ',RELEASER:'ผู้ปล่อยราคา',REPAIR:'Sourcing',SALES:'คุณ',DONE:''};
/* กลุ่มงานในมุมมองของ Sales
   wait  = กำลังรอราคา (อยู่ที่ Sourcing / ผู้จัดการ / ผู้ปล่อยราคา) — อ่านอย่างเดียว ไม่ใช่งานค้างของ Sales
   draft = ร่างคำขอที่ยังไม่ส่ง · ready = ได้ราคาแล้ว · done = ปิดแล้ว */
function stageOf(r){
  const f=fol(r),st=String(r.status||'');
  if(f.owner==='DONE'){
    if(!isSR(r)&&st==='Won')return {key:'done',label:'ปิดการขายได้ 🎉',color:'green',f};
    return {key:'done',label:f.label||'ปิดงาน',color:'grey',f};
  }
  if(f.owner==='SALES')return isSR(r)?{key:'draft',label:'ร่าง — ยังไม่ได้ส่ง',color:'grey',f}
    :{key:'ready',label:f.actionable?f.label:'พร้อมเสนอลูกค้า',color:f.level==='over'?'red':'green',f};
  return {key:'wait',label:f.label,color:f.owner==='MANAGEMENT'?'amber':f.owner==='RELEASER'?'blue':'orange',f};
}
function lastUpd(r){return (r.d&&r.d.salesUpdate&&r.d.salesUpdate.at)?r.d.salesUpdate:null}
function followDate(r){return (r.d&&r.d.followUpDate)||''}
/* งานค้างของ Sales = ได้ราคาแล้ว และถึงเวลาต้องอัปเดต (server ตัดสิน) — งานที่ยังรอราคาไม่นับ */
function needsUpdate(r){const f=fol(r);return !isSR(r)&&f.owner==='SALES'&&!!f.actionable}
function srEditable(r){
  if(!isSR(r)||r.deleted||r.assignedTo)return false;
  if(['Draft','Submitted'].indexOf(String(r.status||'Submitted'))<0)return false;
  if(r.d&&(r.d.quoteIds||[]).length)return false;
  return ownerOf(r)===S.user.id||canRequestForOthers();
}
function rowsOf(personId){
  return Object.values(S.rows).filter(r=>!r.deleted&&(personId==='*'||ownerOf(r)===personId));
}

/* ============================================================ ROUTER (รองรับ hash ของหน้า /exec ด้วย google.script.url) */
function parseRoute(h,params){
  h=String(h||'').replace(/^#?\/?/,'');
  const [page,id]=h.split('/');
  if(params&&params.u){                                   // ?app=sales&u=<email หรือ id>
    const key=String(params.u).toLowerCase();
    const u=S.users.find(x=>x.id.toLowerCase()===key||String(x.email||'').toLowerCase()===key);
    if(u)return {page:'sales',id:u.id};
  }
  if(page==='team'||page==='request'||page==='sales')return {page,id:decodeURIComponent(id||'')};
  return {page:'me',id:''};
}
function readRoute(cb){
  if(window.google&&google.script&&google.script.url){
    google.script.url.getLocation(loc=>{S.route=parseRoute(loc.hash,flatParams(loc.parameter));cb()});
    if(google.script.history)google.script.history.setChangeHandler(e=>{S.route=parseRoute(e.location.hash);render()});
    return;
  }
  S.route=parseRoute(location.hash,Object.fromEntries(new URLSearchParams(location.search)));cb();
}
function flatParams(p){const o={};Object.keys(p||{}).forEach(k=>o[k]=p[k]);return o}
window.addEventListener('hashchange',()=>{if(!gsRun()&&S.user){S.route=parseRoute(location.hash);render()}});
function go(hash){
  S.route=parseRoute(hash);S.filter='all';S.search='';
  if(window.google&&google.script&&google.script.history)google.script.history.push({},{},hash);
  else if(location.hash!=='#'+hash)history.pushState(null,'','#'+hash);
  render();window.scrollTo(0,0);
}
function guardRoute(){
  const r=S.route;
  if(r.page==='sales'&&r.id!==S.user.id&&!canTeam())S.route={page:'me',id:''};   // Sales ทั่วไปเปิดหน้าคนอื่นไม่ได้
  if(r.page==='team'&&!canTeam())S.route={page:'me',id:''};
}

/* ============================================================ RENDER */
function render(){
  if(!S.user)return;
  guardRoute();
  const r=S.route;
  const navs=[{h:'/me',p:'me',ic:'🗂',t:'งานของฉัน'},{h:'/request',p:'request',ic:'➕',t:'ขอราคาใหม่'}];
  if(canTeam())navs.push({h:'/team',p:'team',ic:'👥',t:'ทีมขาย'});
  const on=n=>(n.p===r.page)||(n.p==='me'&&r.page==='sales'&&r.id===S.user.id)||(n.p==='team'&&r.page==='sales'&&r.id!==S.user.id);
  $('#tabs').innerHTML=navs.map(n=>`<button class="tab ${on(n)?'on':''}" onclick="${n.p==='request'?'newRequest()':`go('${n.h}')`}">${n.ic} ${n.t}</button>`).join('');
  $('#bnav').innerHTML=navs.map(n=>`<button class="${on(n)?'on':''}" onclick="${n.p==='request'?'newRequest()':`go('${n.h}')`}"><span class="ic">${n.ic}</span>${n.t}</button>`).join('');
  const m=$('#main');
  if(r.page==='team')m.innerHTML=viewTeam();
  else if(r.page==='request'){m.innerHTML=viewRequest();fillRequestForm();}
  else m.innerHTML=viewPerson(r.page==='sales'&&r.id?r.id:S.user.id);
}

/* ---------- หน้าของ Sales แต่ละคน ---------- */
const FILTERS=[{k:'all',t:'ทั้งหมด'},{k:'wait',t:'กำลังรอราคา'},{k:'ready',t:'พร้อมเสนอ'},{k:'update',t:'ต้องอัปเดต'},{k:'draft',t:'ร่างคำขอ'},{k:'done',t:'ปิดแล้ว'}];
function viewPerson(pid){
  const u=S.users.find(x=>x.id===pid)||(pid===S.user.id?S.user:{id:pid,name:pid,role:'Sales'});

  const all=rowsOf(pid);
  const by=k=>all.filter(r=>k==='update'?needsUpdate(r):stageOf(r).key===k);
  const ready=by('ready'),won=all.filter(r=>r.status==='Won'),wait=by('wait');
  const waitOver=wait.filter(r=>fol(r).level==='over').length;
  let list=S.filter==='all'?all.filter(r=>stageOf(r).key!=='done'||daysSince(r.updatedAt)<=30):by(S.filter);
  const lv=list.filter(r=>fol(r).level!=='ok'&&fol(r).owner!=='DONE');
  if(S.search){const s=S.search.toLowerCase();list=list.filter(r=>(titleOf(r)+' '+custOf(r)+' '+(r.docNo||'')).toLowerCase().indexOf(s)>=0)}
  const rank=r=>needsUpdate(r)?3:(fol(r).level==='over'?2:fol(r).level==='watch'?1:0);   // แย่สุดขึ้นก่อน
  list.sort((a,b)=>(rank(b)-rank(a))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));

  ${isInternal()&&mine?`<div class="banner blue">👀 คุณเป็น <b>${esc(ROLE_TH[S.user.role]||S.user.role)}</b> — แอปนี้แสดงมุมมองของทีมขาย (ไม่มีต้นทุน) · ดูหน้าของ Sales แต่ละคนได้ที่แท็บ <a href="javascript:go('/team')">ทีมขาย</a>
     <span class="spacer"></span><a class="btn sm ghost" href="${esc(CLOUD_URL)}" target="_top">เปิดระบบทำราคา →</a></div>`:''}
  <div class="person">
    <div class="avatar lg">${esc((u.name||'?')[0].toUpperCase())}</div>
    <div style="flex:1;min-width:200px"><h1>${mine?'งานของฉัน':'หน้าของ '+esc(u.name)}</h1>
      <div class="hint">${esc(u.name)}${u.email?' · '+esc(u.email):''} · <span class="tag ${u.role==='Sales'?'orange':'blue'}" style="font-size:10.5px">${esc(ROLE_TH[u.role]||u.role)}</span></div></div>
    ${!mine?`<button class="btn sm ghost" onclick="copyText('${esc(link)}','คัดลอกลิงก์หน้านี้แล้ว')" title="ส่งให้ Sales คนนี้เปิดหน้าของตัวเอง">🔗 คัดลอกลิงก์</button>`:''}
    ${mine||canRequestForOthers()?`<button class="btn sm" onclick="newRequest('${esc(mine?'':pid)}')">➕ ขอราคาใหม่${mine?'':' ให้ '+esc(u.name)}</button>`:''}
  </div>
  <div class="kpis">
    ${kpiBox('all','งานที่เปิดอยู่',all.filter(r=>stageOf(r).key!=='done').length,'คำขอ + ใบเสนอราคา')}
    ${kpiBox('wait','กำลังรอราคา',wait.length,waitOver?('⛔ เกินกำหนด '+waitOver+' (ทีมภายในกำลังเร่ง)'):'อยู่ที่ Sourcing / ผู้จัดการ')}
    ${kpiBox('ready','พร้อมเสนอลูกค้า',ready.length,money(ready.reduce((s,r)=>s+valueTHB(r),0),'THB')+' (รวมเป็นบาท)')}
    ${kpiBox('update','ต้องอัปเดต',by('update').length,'ไม่ได้อัปเดตเกิน '+SALES_UPDATE_DAYS+' วัน / เลยนัด',by('update').length?'red':'')}
    ${kpiBox('done','ปิดการขายได้',won.length,money(won.reduce((s,r)=>s+valueTHB(r),0),'THB'))}
  </div>
  <div class="toolbar">
    <input class="inp search" placeholder="🔍 ค้นหา ลูกค้า / โครงการ / เลขเอกสาร" value="${esc(S.search)}" oninput="S.search=this.value;rerenderList('${esc(pid)}')">
    <select class="inp" style="width:auto" onchange="S.filter=this.value;render()">${FILTERS.map(f=>`<option value="${f.k}" ${S.filter===f.k?'selected':''}>${f.t}</option>`).join('')}</select>
    <span class="hint">${list.length} รายการ${lv.length?` · <b style="color:var(--red)">⛔ เกินกำหนด ${lv.filter(r=>fol(r).level==='over').length}</b> · <b style="color:var(--amber)">⚠ ครบกำหนด ${lv.filter(r=>fol(r).level==='watch').length}</b>`:''}</span>

function rerenderList(pid){
  const html=viewPerson(pid);const tmp=document.createElement('div');tmp.innerHTML=html;
  const nl=tmp.querySelector('#jobList');if(nl&&$('#jobList'))$('#jobList').innerHTML=nl.innerHTML;
}
function kpiBox(k,l,v,s,color){
  return `<div class="kpi ${S.filter===k?'on':''}" onclick="S.filter='${k}';render()"><div class="l">${l}</div>
    <div class="v" style="${color?'color:var(--'+color+')':''}">${v}</div><div class="s">${s}</div></div>`;
}
function jobsHTML(list){
  if(!list.length)return `<div class="empty" style="grid-column:1/-1"><div class="big">📭</div>ยังไม่มีงานในหมวดนี้<div style="margin-top:12px"><button class="btn sm" onclick="newRequest()">➕ ขอราคาใหม่</button></div></div>`;
  return list.map(jobCard).join('');
}
function jobCard(r){
  const sg=stageOf(r),f=sg.f,upd=lastUpd(r),need=needsUpdate(r),fl=followDate(r);
  const flash=S.flash[r.id]&&Date.now()-S.flash[r.id]<6000;
  const shown=priceShown(r);
  const unapproved=shown&&['Approved','Pending','Won','Closed'].indexOf(String(r.status))<0;
  let val;
  if(isSR(r))val=`<span class="hint">${(r.d&&r.d.lines||[]).length} รายการที่ขอ${hdr(r).needBy?' · ต้องการภายใน '+esc(hdr(r).needBy):''}</span>`;
  else if(shown)val=`<span class="job-val">${money(valueOf(r),curOf(r))}</span>${curOf(r)!=='THB'&&r.valueTHB!=null?` <span class="hint">≈ ${money(r.valueTHB,'THB')}</span>`:''}${r.gp!=null&&isInternal()?` <span class="tag ${r.gp>=20?'green':r.gp>=12?'amber':'red'}">GP ${fmt(r.gp,1)}%</span>`:''}`;
  else val=`<span class="hint">🔒 ${f.owner==='REPAIR'?'ทีม Sourcing กำลังเตรียมราคาฉบับสำหรับ Sales':f.owner==='RELEASER'?'รอปล่อยราคาให้คุณ':'ยังไม่ถึงขั้นตอนเห็นราคา'}</span>`;
  const waitLine=(sg.key==='wait'&&f.waitingDays!=null)?`<span>⏳ รออยู่ที่ ${esc(OWNER_SHORT[f.owner]||'')} ${f.waitingDays} วันทำการ${f.slaDays?' (กำหนด '+f.slaDays+')':''}</span>`:'';
  const lvl=(f.level&&f.level!=='ok'&&sg.key!=='done')?`<span class="tag ${f.level==='over'?'red':'amber'}">${f.level==='over'?'⛔ เกินกำหนด':'⚠ ครบกำหนดวันนี้'}</span>`:'';
  const acts=[];
  if(isSR(r)){
    acts.push(`<button class="btn sm ghost" onclick="openDetail('${r.id}')">ดูรายละเอียด</button>`);
    if(srEditable(r))acts.push(`<button class="btn sm ghost" onclick="editRequest('${r.id}')">✏️ แก้ไข</button>`,
      `<button class="btn sm ghost" style="color:var(--red)" onclick="deleteRequest('${r.id}')">ลบ</button>`);
  }else{
    if(shown)acts.push(`<button class="btn sm" onclick="openDetail('${r.id}')">💰 ดูราคา</button>`);
    else acts.push(`<button class="btn sm ghost" onclick="openDetail('${r.id}')">ดูรายละเอียด</button>`);
    if(f.owner==='SALES'&&(ownerOf(r)===S.user.id||canTeam()))acts.push(`<button class="btn sm ${need?'red':'ghost'}" onclick="openUpdate('${r.id}')">📝 อัปเดตความคืบหน้า</button>`);
    if(r.canRelease)acts.push(`<button class="btn sm blue" onclick="releasePrice('${r.id}')">🔓 ${String(r.status)==='Pending'?'ยืนยันปล่อยราคาให้':'ปล่อยราคาให้'} ${esc(userName(ownerOf(r))||r.sales||'Sales')}</button>`);
  }
  return `<div class="job ${need?'alert':(sg.key==='wait'&&f.level==='over'?'late':'')} ${flash?'flash':''}">
    <div class="job-top"><div style="min-width:0"><div class="job-t">${esc(titleOf(r))}</div><div class="job-c">${esc(custOf(r))}</div></div>
      <div class="job-no">${esc(r.docNo||'—')}${isSR(r)?'':''}</div></div>
    <div class="job-mid"><span class="tag ${sg.color}">${esc(sg.label)}</span>${lvl}${unapproved?'<span class="tag red" title="ราคานี้ยังไม่ผ่านการอนุมัติ ห้ามส่งให้ลูกค้า">⚠ ราคายังไม่อนุมัติ</span>':''}</div>
    <div class="job-mid">${val}</div>
    <div class="job-meta">${waitLine}<span>${isSR(r)?'📨 คำขอราคา':'📄 ใบเสนอราคา'}</span>
      ${S.route.page==='sales'&&S.route.id!==S.user.id||canTeam()?`<span>👤 ${esc(userName(ownerOf(r))||r.sales||'ไม่ระบุ')}</span>`:''}
      <span>อัปเดต ${esc(agoTH(r.updatedAt))}</span>
      ${upd?`<span>📝 ${esc(upd.stage||'')} · ${esc(agoTH(upd.at))}</span>`:''}
      ${fl?`<span style="${fl<todayISO()?'color:var(--red);font-weight:600':''}">📅 นัด ${esc(fl)}</span>`:''}</div>
    ${acts.length?`<div class="job-acts">${acts.join('')}</div>`:''}
  </div>`;
}

/* ---------- ทีมขาย (ผู้จัดการ) ---------- */
function viewTeam(){
  const ids=new Set(S.users.filter(u=>u.role==='Sales'||u.role==='Sales Manager').filter(u=>u.active!==false).map(u=>u.id));
  Object.values(S.rows).forEach(r=>{if(!r.deleted)ids.add(ownerOf(r))});
  const people=[...ids].map(id=>{
    const rs=rowsOf(id),u=S.users.find(x=>x.id===id);
    const open=rs.filter(r=>stageOf(r).key!=='done'),ready=rs.filter(r=>stageOf(r).key==='ready');
    return {id,u,name:u?u.name:(id?id:'ไม่ระบุเจ้าของ'),open:open.length,req:rs.filter(r=>stageOf(r).key==='wait').length,
      ready:ready.length,readyVal:ready.reduce((s,r)=>s+valueTHB(r),0),upd:rs.filter(needsUpdate).length,
      won:rs.filter(r=>r.status==='Won').length};

function copyQuote(id){
  const r=S.rows[id];if(!r||!r.d)return;const H=hdr(r),d=r.d;
  const lines=(d.lines||[]).map((L,i)=>`${i+1}. ${L.code?L.code+' ':''}${L.desc||''}\n   ${fmt0(L.qty)} ${L.uom||''} × ${fmt(L.unitPrice)} = ${fmt(L.amount)} ${H.currency||'THB'}`).join('\n');
  const txt=`ใบเสนอราคา ${r.docNo||''}\nโครงการ: ${titleOf(r)}\nลูกค้า: ${custOf(r)}\n\n${lines}\n${(+d.extrasTotal||0)>0?'ค่าใช้จ่ายเพิ่มเติม: '+fmt(d.extrasTotal)+'\n':''}รวมทั้งสิ้น: ${fmt(d.total)} ${H.currency||'THB'}\n${H.incoterm||''} · ยืนราคา ${H.validity||30} วัน`;
  copyText(txt,'คัดลอกรายละเอียดราคาแล้ว');
}
function copyText(t,msg){
  const done=()=>toast(msg||'คัดลอกแล้ว','good');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done);
}
function fallbackCopy(t,done){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){prompt('คัดลอกข้อความนี้',t)}a.remove()}

  const r=S.rows[id];if(!r)return;const u=lastUpd(r)||{};
  modal(`<div class="modal-h"><h3>📝 อัปเดตความคืบหน้ากับลูกค้า</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>

    <div class="field"><label class="lbl">สถานะกับลูกค้าตอนนี้</label><select class="inp" id="up_stage">${CUST_STAGES.map(x=>`<option ${u.stage===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">รายละเอียด / สิ่งที่คุยกับลูกค้า</label><textarea class="inp" id="up_note" rows="3" placeholder="เช่น ลูกค้าขอส่วนลดเพิ่ม 3% เทียบอยู่กับอีก 2 เจ้า">${esc(u.note||(r.d&&r.d.salesNote)||'')}</textarea></div>

      <div class="field" style="flex:1"><label class="lbl">วันที่นัดติดตาม</label><input class="inp" id="up_date" type="date" value="${esc(followDate(r))}"></div></div>
  </div>
  <div class="modal-f"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" id="upBtn" onclick="saveUpdate('${r.id}')">บันทึกการอัปเดต</button></div>`);
}
async function saveUpdate(id){
  const r=S.rows[id];if(!r)return;
  const stage=$('#up_stage').value,note=($('#up_note').value||'').trim(),next=$('#up_next').value,date=$('#up_date').value||'';
  const at=new Date().toISOString();
  const patch={salesUpdate:{at,by:S.user.id,byName:S.user.name,stage,note,next},salesUpdatedAt:at,salesNote:note,followUpDate:date};
  $('#upBtn').disabled=true;
  const res=await api({action:'salesPatch',id,patch:JSON.stringify(patch),note:'Sales update: '+stage+(next?' · ถัดไป '+next:'')+(date?' · นัด '+date:'')});
  if(!res.ok){$('#upBtn').disabled=false;toast('บันทึกไม่สำเร็จ: '+(res.error||'-'),'bad');return}
  if(r.d)Object.assign(r.d,patch);r.updatedAt=res.updatedAt||at;S.flash[id]=Date.now();
  if(res.follow)r.follow=res.follow;
  closeModal();toast('บันทึกความคืบหน้าแล้ว','good');render();
}

function releasePrice(id){
  const r=S.rows[id];if(!r)return;const owner=userName(ownerOf(r))||r.sales||'Sales';
  modal(`<div class="modal-h"><h3>ยืนยันการปล่อยราคา</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>

      มูลค่ารวม <b>${money(valueOf(r)||r.salesValue,curOf(r))}</b> · ${String(r.status)==='Pending'?'ใบรุ่นเก่า — เป็นการยืนยันสิทธิ์เห็นราคาให้เจ้าของงาน':'สถานะจะเปลี่ยนเป็น “พร้อมเสนอลูกค้า”'}</div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn blue" id="relBtn" onclick="doRelease('${r.id}')">🔓 ยืนยันปล่อยราคา</button></div>`);

async function doRelease(id){
  $('#relBtn').disabled=true;
  const res=await api({action:'release',id});
  closeModal();
  if(!res.ok){toast(res.error==='NOT_APPROVED'?'ใบนี้ไม่ได้อยู่ในสถานะอนุมัติแล้ว (มีคนเปลี่ยนสถานะไปก่อน)'
    :res.error==='NO_SALES_COPY'?'ใบนี้ยังไม่มีราคาฉบับ Sales — ให้ Sourcing กด “สร้างข้อมูลสำหรับ Sales” ก่อน':('ปล่อยราคาไม่สำเร็จ: '+(res.error||'-')),'bad');await poll(true);return}
  toast('ปล่อยราคาแล้ว','good');await poll(true);render();
}

    <div><label>หน่วย</label><input class="inp" id="lu_${i}" list="uomList" value="${esc(L.uom)}" oninput="lset(${i},'uom',this.value)"></div>
    <div><label>ราคาเป้าหมาย/หน่วย</label><input class="inp" type="number" min="0" step="any" value="${esc(L.targetUp)}" placeholder="ถ้ามี" oninput="lset(${i},'targetUp',this.value)"></div>
    <div class="c2"><label>หมายเหตุ</label><input class="inp" value="${esc(L.note)}" placeholder="เช่น ยี่ห้อ / สเปค" oninput="lset(${i},'note',this.value)"></div>
    <button class="del" onclick="delLine(${i})" title="ลบรายการ">✕</button></div>`).join('')+
    `<datalist id="uomList">${listOf('units').map(u=>`<option value="${esc(u)}">`).join('')}</datalist>`;
}
function lset(i,k,v){S.form.lines[i][k]=v;saveDraft()}
function pickCode(i,code){
  const L=S.form.lines[i];L.code=(code||'').trim();
  const p=S.products.find(x=>x.code.toLowerCase()===L.code.toLowerCase())
        ||S.products.find(x=>(x.desc||'').toLowerCase()===L.code.toLowerCase());
  if(p){L.code=p.code;if(!L.desc)L.desc=p.desc;if(p.uom)L.uom=String(p.uom).toLowerCase()==='pcs'?'pcs':p.uom;L.group=p.group||'';}
  saveDraft();renderLines();
}
function addLine(){S.form.lines.push({code:'',desc:'',qty:1,uom:'pcs',targetUp:'',note:''});saveDraft();renderLines();
  setTimeout(()=>{const el=$('#ld_'+(S.form.lines.length-1));if(el)el.focus()},30)}
function delLine(i){if(S.form.lines.length===1){S.form.lines=blankForm().lines}else S.form.lines.splice(i,1);saveDraft();renderLines()}
function cancelRequest(){S.form=null;go('/me')}
let _submitting=false;
async function submitRequest(status){
  if(_submitting)return;
  const F=S.form,H=F.header;
  const lines=F.lines.filter(L=>(L.desc||'').trim()||(L.code||'').trim());
  if(!(H.customer||'').trim()){toast('กรุณาใส่ชื่อลูกค้า','bad');$('#f_customer').focus();return}
  if(!lines.length){toast('กรุณาใส่รายการสินค้าอย่างน้อย 1 รายการ','bad');return}
  if(lines.some(L=>!(L.desc||'').trim()&&!(L.code||'').trim())){toast('กรุณาใส่ชื่อสินค้าให้ครบทุกรายการ','bad');return}
  if(lines.some(L=>!(+L.qty>0))){toast('จำนวนสินค้าต้องมากกว่า 0','bad');return}
  const owner=S.users.find(u=>u.id===F.ownerId)||S.user;
  const id=F.id||uid();
  const now=new Date().toISOString();
  // โครงสร้างเดียวกับ submitSalesRequest() ใน Index.html → ฝั่ง Sourcing รับงาน/สร้าง QT ต่อได้ทันที
  const doc={id,_v:2,docType:'SR',docNo:F.docNo||'',status,quoteIds:[],assignedTo:null,
    updated:todayISO(),updatedAt:now,rev:1,stage:'Draft',followStatus:'Requested',round:1,
    salesNote:(F.spec||'').trim(),approvals:[],parentId:null,releasedTo:[],
    header:{ref:F.docNo||'',customer:H.customer.trim(),title:(H.title||'').trim()||H.customer.trim(),
      sales:owner.name,salesUserId:owner.id,groupType:H.groupType,reqDate:todayISO(),needBy:H.needBy||'',
      currency:H.currency,priceTerm:H.priceTerm,incoterm:H.incoterm,offerDate:todayISO(),validity:+H.validity||30},
    lines:lines.map(L=>({code:(L.code||'').trim(),desc:(L.desc||L.code||'').trim(),group:L.group||H.groupType,
      uom:L.uom||'pcs',qty:+L.qty||1,targetUp:+L.targetUp||0,salesNote:(L.note||'').trim()})),
    remarks:[]};
  _submitting=true;['#btnDraft','#btnSend'].forEach(s=>{const b=$(s);if(b)b.disabled=true});
  const res=await api({action:'saveSR',id,detail:JSON.stringify(doc)});
  _submitting=false;['#btnDraft','#btnSend'].forEach(s=>{const b=$(s);if(b)b.disabled=false});
  if(!res.ok){
    toast(res.error==='SR_LOCKED'?'คำขอนี้ถูก Sourcing รับงานไปแล้ว แก้ไขไม่ได้':('ส่งไม่สำเร็จ: '+(res.error||'-')+' — ร่างยังอยู่ ลองใหม่ได้'),'bad');return}
  if(!F.id)LS.del(DRAFT_KEY);
  S.form=null;S.flash[id]=Date.now();
  toast(status==='Draft'?('บันทึกร่าง '+(res.docNo||'')+' แล้ว'):('ส่งคำขอ '+(res.docNo||'')+' ให้ Sourcing แล้ว ✓'),'good');
  await poll(true);
  go(owner.id===S.user.id?'/me':'/sales/'+encodeURIComponent(owner.id));
}
function deleteRequest(id){
  const r=S.rows[id];if(!r)return;
  modal(`<div class="modal-h"><h3>ลบคำขอราคา?</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">ลบ <b>${esc(titleOf(r))}</b> (${esc(r.docNo||'')}) — ลบได้เพราะ Sourcing ยังไม่รับงาน</div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn red" onclick="doDelete('${r.id}')">ลบคำขอ</button></div>`);
}
async function doDelete(id){
  closeModal();const res=await api({action:'delete',id});
  if(!res.ok){toast(res.error==='SR_LOCKED'?'Sourcing รับงานไปแล้ว ลบไม่ได้':('ลบไม่สำเร็จ: '+(res.error||'-')),'bad');return}
  if(S.rows[id])S.rows[id].deleted=true;toast('ลบคำขอแล้ว','good');render();
}

/* ============================================================ บัญชีของฉัน */
function openMe(){
  const u=S.user;
  modal(`<div class="modal-h"><h3>บัญชีของฉัน</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="row"><div class="avatar lg">${esc((u.name||'?')[0].toUpperCase())}</div>
      <div><b style="font-size:16px">${esc(u.name)}</b><div class="hint">${esc(u.email||u.id)}</div>
      <span class="tag orange">${esc(ROLE_TH[u.role]||u.role)}</span></div></div>
      <div class="hint" style="margin-top:14px;line-height:1.8">สิทธิ์: ${canTeam()?'เห็นงานของ Sales ทุกคน':'เห็นเฉพาะงานของตัวเอง'} · ${canRequestForOthers()?'ขอราคาแทน Sales คนอื่นได้':'ขอราคาในนามตัวเอง'}<br>
      การเปลี่ยนสิทธิ์ทำได้โดยผู้ดูแลระบบ (แท็บ Users / หน้าจัดการผู้ใช้)</div></div>
    <div class="modal-f"><button class="btn ghost" onclick="openChangePassword()">🔑 เปลี่ยนรหัสผ่าน</button><button class="btn red" onclick="logout()">ออกจากระบบ</button></div>`);
}
function openChangePassword(forced){
  modal(`<div class="modal-h"><h3>${forced?'⚠️ กรุณาตั้งรหัสผ่านใหม่':'เปลี่ยนรหัสผ่าน'}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">${forced?'<div class="banner amber">บัญชีของคุณยังใช้รหัสตั้งต้นของระบบ ซึ่งคนอื่นเดาได้ง่าย</div>':''}
      <div class="field"><label class="lbl">รหัสผ่านปัจจุบัน</label><input class="inp" id="pw_old" type="password" autocomplete="current-password" value="${forced?'1234':''}"></div>
      <div class="field"><label class="lbl">รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</label><input class="inp" id="pw_new" type="password" autocomplete="new-password"></div>
      <div class="field"><label class="lbl">ยืนยันรหัสผ่านใหม่</label><input class="inp" id="pw_new2" type="password" autocomplete="new-password"></div>
      <div class="login-err" id="pw_err"></div></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">ไว้ทีหลัง</button><button class="btn" onclick="saveChangePassword()">บันทึก</button></div>`);
}
async function saveChangePassword(){
  const o=$('#pw_old').value,n1=$('#pw_new').value,n2=$('#pw_new2').value;
  if(!n1||n1.length<6){$('#pw_err').textContent='รหัสใหม่ต้องอย่างน้อย 6 ตัว';return}
  if(n1!==n2){$('#pw_err').textContent='รหัสใหม่ทั้งสองช่องไม่ตรงกัน';return}
  if(n1==='1234'){$('#pw_err').textContent='ห้ามใช้รหัสตั้งต้น';return}
  const r=await api({action:'changePassword',oldHash:await hashPass(o),newHash:await hashPass(n1)});
  if(!r.ok){$('#pw_err').textContent=r.error==='BAD_OLD_PASSWORD'?'รหัสผ่านปัจจุบันไม่ถูกต้อง':('ไม่สำเร็จ: '+(r.error||'-'));return}
  closeModal();toast('เปลี่ยนรหัสผ่านแล้ว','good');
}

/* ============================================================ MODAL / TOAST / START */
function modal(html,wide){$('#modalRoot').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
let _tt;function toast(msg,kind){const t=$('#toast');t.className='toast '+(kind||'')+' show';t.textContent=msg;clearTimeout(_tt);_tt=setTimeout(()=>t.className='toast '+(kind||''),3000)}

window.__booted=true;   // boot guard: สคริปต์หลักโหลดครบแล้ว
(async function start(){
  $('#buildStamp').textContent=BUILD;
  if(LOGO){$('#loginLogo').src=LOGO;$('#topLogo').src=LOGO}else{$('#loginLogo').remove();$('#topLogo').remove()}
  $('#loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginPass').focus()});
  $('#loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
  S.token=LS.get('token','');S.user=LS.get('user',null);
  if(S.token&&S.user){
    const w=await apiGet('whoami');                       // ตรวจว่า token ยังใช้ได้ + สิทธิ์ล่าสุดจาก server
    if(w&&w.ok){S.user=Object.assign({},S.user,w.user);LS.set('user',S.user);boot();return}
    S.token='';LS.del('token');
  }
  showLogin();
  if(gsRun())ssoLogin(true);                               // เปิดผ่าน /exec + Google account ลงทะเบียนไว้ → เข้าเลย
})();
</script>
